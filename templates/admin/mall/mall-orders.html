<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .order-container {
            padding: 20px;
        }
        .order-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-form {
            margin-bottom: 20px;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 4px;
        }
        .order-table {
            margin-bottom: 20px;
        }
        .order-status {
            font-weight: bold;
        }
        .status-pending { color: #e6a23c; }
        .status-paid { color: #409eff; }
        .status-shipped { color: #67c23a; }
        .status-completed { color: #909399; }
        .status-cancelled { color: #f56c6c; }
        .status-cancel-requested { color: #f56c6c; background-color: #fef0f0; }
    </style>
</head>
<body>
    <div id="app">
        <admin-layout :user-info="userInfo" active-menu="mall-orders">
            <template #content>
                <div class="order-container">
                <div class="order-header">
                    <h2>订单管理</h2>
                </div>

                <!-- 搜索表单 -->
                <el-card class="search-form">
                    <el-form :model="searchForm" inline>
                        <el-form-item label="订单号">
                            <el-input v-model="searchForm.orderNo" placeholder="请输入订单号" clearable></el-input>
                        </el-form-item>
                        <el-form-item label="用户">
                            <el-input v-model="searchForm.username" placeholder="请输入用户名" clearable></el-input>
                        </el-form-item>
                        <el-form-item label="状态">
                            <el-select v-model="searchForm.status" placeholder="请选择状态" clearable>
                                <el-option label="待付款" value="pending"></el-option>
                                <el-option label="已付款" value="paid"></el-option>
                                <el-option label="已发货" value="shipped"></el-option>
                                <el-option label="已完成" value="completed"></el-option>
                                <el-option label="已取消" value="cancelled"></el-option>
                                <el-option label="取消申请中" value="cancel_requested"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item label="创建时间">
                            <el-date-picker
                                v-model="searchForm.dateRange"
                                type="datetimerange"
                                range-separator="至"
                                start-placeholder="开始日期"
                                end-placeholder="结束日期">
                            </el-date-picker>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" @click="searchOrders">搜索</el-button>
                            <el-button @click="resetSearch">重置</el-button>
                        </el-form-item>
                    </el-form>
                </el-card>

                <!-- 订单列表 -->
                <el-card>
                    <el-table 
                        :data="orders" 
                        v-loading="loading">
                        <el-table-column prop="orderNo" label="订单号"  ></el-table-column>
                        <el-table-column prop="username" label="用户" ></el-table-column>
                        <el-table-column prop="payAmount" label="金额"  >
                            <template slot-scope="scope">
                                <span style="color: #f56c6c; font-weight: bold;">
                                    ¥{{ scope.row.payAmount }}
                                </span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="status" label="状态" >
                            <template slot-scope="scope">
                                <el-tag :class="getStatusClass(scope.row.status)">
                                    {{ getStatusText(scope.row.status) }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="payMethod" label="支付方式" width="140"></el-table-column>
                        <el-table-column prop="createTime" label="创建时间">
                            <template slot-scope="scope">
                                {{ formatDate(scope.row.createTime) }}
                            </template>
                        </el-table-column>
                        <el-table-column label="操作"fixed="right" width="200">
                            <template slot-scope="scope">
                                <el-button type="text" @click="viewOrderDetail(scope.row)">查看详情</el-button>
                                <el-button
                                    v-if="scope.row.status === 'paid' && userRole !== 'platform_operator'"
                                    type="text"
                                    @click="shipOrder(scope.row)">
                                    发货
                                </el-button>
                                <el-button
                                    v-if="(scope.row.status === 'shipped' || scope.row.status === 'delivered') && userRole !== 'platform_operator'"
                                    type="text"
                                    @click="editLogistics(scope.row)">
                                    物流信息
                                </el-button>
                                <el-button
                                    v-if="scope.row.status === 'shipped' && userRole !== 'platform_operator'"
                                    type="text"
                                    @click="completeOrder(scope.row)">
                                    完成
                                </el-button>
                                <el-button
                                    v-if="scope.row.status === 'cancel_requested' && userRole !== 'platform_operator'"
                                    type="text"
                                    style="color: #67c23a;"
                                    @click="approveCancelRequest(scope.row, true)">
                                    通过
                                </el-button>
                                <el-button
                                    v-if="scope.row.status === 'cancel_requested' && userRole !== 'platform_operator'"
                                    type="text"
                                    style="color: #f56c6c;"
                                    @click="approveCancelRequest(scope.row, false)">
                                    拒绝
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>

                    <!-- 分页 -->
                    <el-pagination
                        v-if="total > 0"
                        @size-change="handleSizeChange"
                        @current-change="handleCurrentChange"
                        :current-page="currentPage"
                        :page-sizes="[10, 20, 50, 100]"
                        :page-size="pageSize"
                        layout="total, sizes, prev, pager, next, jumper"
                        :total="total"
                        style="margin-top: 20px; text-align: center;">
                    </el-pagination>
                </el-card>

                <!-- 订单详情对话框 -->
                <el-dialog
                    title="订单详情"
                    :visible.sync="detailDialogVisible"
                    width="50%">
                    <div v-if="orderDetail">
                        <el-descriptions :column="2" border>
                            <el-descriptions-item label="订单号">{{ orderDetail.orderNo }}</el-descriptions-item> 
                            <el-descriptions-item label="状态">
                                <el-tag :class="getStatusClass(orderDetail.status)">
                                    {{ getStatusText(orderDetail.status) }}
                                </el-tag>
                            </el-descriptions-item>
                            <el-descriptions-item label="支付方式">{{ orderDetail.paymentMethod }}</el-descriptions-item>
                            <el-descriptions-item label="订单金额">¥{{ orderDetail.payAmount }}</el-descriptions-item>
                            <el-descriptions-item label="创建时间">{{ formatDate(orderDetail.createTime) }}</el-descriptions-item>
                        </el-descriptions>

                        <div style="margin-top: 20px;">
                            <h4>商品列表</h4>
                            <el-table :data="orderDetail.items" border>
                                <el-table-column label="商品图片" width="80">
                                    <template slot-scope="scope">
                                        <img 
                                            :src="scope.row.image || '/static/image/no-image.png'" 
                                            :alt="scope.row.productName"
                                            style="width: 50px; height: 50px; object-fit: cover;">
                                    </template>
                                </el-table-column>
                                <el-table-column prop="productName" label="商品名称"></el-table-column>
                                <el-table-column prop="price" label="单价" width="100">
                                    <template slot-scope="scope">
                                        ¥{{ scope.row.price }}
                                    </template>
                                </el-table-column>
                                <el-table-column prop="quantity" label="数量" width="80"></el-table-column>
                                <el-table-column label="小计" width="100">
                                    <template slot-scope="scope">
                                        ¥{{ (scope.row.price * scope.row.quantity).toFixed(2) }}
                                    </template>
                                </el-table-column>
                                <el-table-column prop="reviewRating" label="评分">
                                    <template slot-scope="scope">
                                        <el-rate v-if="scope.row.reviewRating"
                                            :value="scope.row.reviewRating" 
                                            disabled 
                                            show-score 
                                            text-color="#ff9900"></el-rate>
                                        <span v-else>暂无评分</span>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="reviewContent" label="评价内容">
                                    <template slot-scope="scope">
                                        <span v-if="scope.row.reviewContent">{{ scope.row.reviewContent }}</span>
                                        <span v-else>暂无评价</span>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="reviewTime" label="评价时间">
                                    <template slot-scope="scope">
                                        <span v-if="scope.row.reviewTime">{{ formatDate(scope.row.reviewTime) }}</span>
                                        <span v-else>暂无评价时间</span>
                                    </template>
                                </el-table-column>
                            </el-table>
                        </div>
                    </div>
                    </el-dialog>

                                    
                    <!-- 发货对话框 -->
                    <el-dialog title="发货" :visible.sync="shipDialogVisible" width="500px">
                        <el-form :model="shipForm" label-width="100px">
                            <el-form-item label="订单号">
                                <el-input v-model="currentOrder.orderNo" disabled></el-input>
                            </el-form-item>
                            <el-form-item label="物流公司" required>
                                <el-select v-model="shipForm.shippingCompany" placeholder="请选择物流公司" style="width: 100%">
                                    <el-option label="顺丰速运" value="顺丰速运"></el-option>
                                    <el-option label="圆通速递" value="圆通速递"></el-option>
                                    <el-option label="中通快递" value="中通快递"></el-option>
                                    <el-option label="申通快递" value="申通快递"></el-option>
                                    <el-option label="韵达速递" value="韵达速递"></el-option>
                                    <el-option label="京东物流" value="京东物流"></el-option>
                                    <el-option label="邮政EMS" value="邮政EMS"></el-option>
                                    <el-option label="其他" value="其他"></el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item label="物流单号" required>
                                <el-input v-model="shipForm.trackingNumber" placeholder="请输入物流单号"></el-input>
                            </el-form-item>
                            <el-form-item label="物流信息">
                                <el-input 
                                    v-model="shipForm.logisticsInfo" 
                                    type="textarea" 
                                    :rows="6"
                                    placeholder="请输入物流跟踪信息，每行一条记录，例如：&#10;2026-03-07 10:00:00 订单已创建&#10;2026-03-07 11:00:00 商家备货中&#10;2026-03-07 14:00:00 订单已发货">
                                </el-input>
                                <div style="color: #909399; font-size: 12px; margin-top: 5px;">
                                    提示：每行一条物流记录，建议格式：时间 + 状态描述
                                </div>
                            </el-form-item>
                        </el-form>
                        <div slot="footer" class="dialog-footer">
                            <el-button @click="shipDialogVisible = false">取消</el-button>
                            <el-button type="primary" @click="confirmShip">确认发货</el-button>
                        </div>
                    </el-dialog>

                    <!-- 物流信息编辑对话框 -->
                    <el-dialog title="编辑物流信息" :visible.sync="logisticsDialogVisible" width="600px">
                        <el-form :model="logisticsForm" label-width="100px">
                            <el-form-item label="订单号">
                                <el-input v-model="logisticsForm.orderNo" disabled></el-input>
                            </el-form-item>
                            <el-form-item label="物流公司">
                                <el-select v-model="logisticsForm.shippingCompany" placeholder="请选择物流公司" style="width: 100%">
                                    <el-option label="顺丰速运" value="顺丰速运"></el-option>
                                    <el-option label="圆通速递" value="圆通速递"></el-option>
                                    <el-option label="中通快递" value="中通快递"></el-option>
                                    <el-option label="申通快递" value="申通快递"></el-option>
                                    <el-option label="韵达速递" value="韵达速递"></el-option>
                                    <el-option label="京东物流" value="京东物流"></el-option>
                                    <el-option label="邮政EMS" value="邮政EMS"></el-option>
                                    <el-option label="其他" value="其他"></el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item label="物流单号">
                                <el-input v-model="logisticsForm.trackingNumber" ></el-input>
                            </el-form-item>
                            <el-form-item label="物流信息">
                                <el-input 
                                    v-model="logisticsForm.logisticsInfo" 
                                    type="textarea" 
                                    :rows="10"
                                    placeholder="请输入物流跟踪信息，每行一条记录，例如：&#10;2026-03-07 10:00:00 订单已创建&#10;2026-03-07 11:00:00 商家备货中&#10;2026-03-07 14:00:00 订单已发货&#10;2026-03-07 16:00:00 快件已到达转运中心&#10;2026-03-07 18:00:00 派送中">
                                </el-input>
                                <div style="color: #909399; font-size: 12px; margin-top: 5px;">
                                    提示：每行一条物流记录，建议格式：时间 + 状态描述
                                </div>
                            </el-form-item>
                        </el-form>
                        <div slot="footer" class="dialog-footer">
                            <el-button @click="logisticsDialogVisible = false">取消</el-button>
                            <el-button type="primary" @click="updateLogistics">保存</el-button>
                        </div>
                    </el-dialog>

                </div>
            </template>
        </admin-layout>
    </div>


    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>
    <script>
        new Vue({
            el: '#app', 
            data() {
                return {
                    userInfo: {},
                    userRole: '',
                    orders: [],
                    loading: false,
                    currentPage: 1,
                    pageSize: 10,
                    total: 0,
                    searchForm: {
                        orderNo: '',
                        username: '',
                        status: '',
                        dateRange: []
                    },
                    detailDialogVisible: false,
                    orderDetail: null,
                    shipDialogVisible: false,
                    currentOrder: {},
                    shipForm: {
                        trackingNumber: '',
                        shippingCompany: '',
                        logisticsInfo: ''
                    },
                    logisticsDialogVisible: false,
                    logisticsForm: {
                        logisticsInfo: ''
                    }
                }
            },
            mounted() {
                this.checkAuth();
                this.loadOrders();
            },
            methods: {
                // 检查登录状态
                checkAuth() {
                    const userInfo = localStorage.getItem('userInfo');
                    if (userInfo) {
                        this.userInfo = JSON.parse(userInfo);
                        this.userRole = this.userInfo.role || '';
                    } else {
                        this.$message.warning('请先登录');
                        window.location.href = '/login';
                    }
                },

                // 加载订单列表
                async loadOrders() {
                    this.loading = true;
                    try {
                        const params = {
                            page: this.currentPage,
                            limit: this.pageSize,
                            orderNo: this.searchForm.orderNo,
                            username: this.searchForm.username,
                            status: this.searchForm.status
                        };

                        // 处理日期范围
                        if (this.searchForm.dateRange && this.searchForm.dateRange.length === 2) {
                            params.startTime = this.searchForm.dateRange[0];
                            params.endTime = this.searchForm.dateRange[1];
                        }

                        const result = await axios.get('/api/mall/order/admin/list', { params });
                        
                        if (result.data.code === 200) {
                            this.orders = result.data.data.rows;
                            this.total = result.data.data.total;
                        } else {
                            this.$message.error(result.data.message);
                        }
                    } catch (error) {
                        console.error('加载订单列表失败:', error);
                        this.$message.error('加载订单列表失败');
                    } finally {
                        this.loading = false;
                    }
                },

                // 搜索订单
                searchOrders() {
                    this.currentPage = 1;
                    this.loadOrders();
                },

                // 重置搜索
                resetSearch() {
                    this.searchForm = {
                        orderNo: '',
                        username: '',
                        status: '',
                        dateRange: []
                    };
                    this.currentPage = 1;
                    this.loadOrders();
                },

                // 获取状态文本
                getStatusText(status) {
                    const statusMap = {
                        'pending': '待付款',
                        'paid': '已付款',
                        'shipped': '已发货',
                        'delivered': '已收货',
                        'completed': '已完成',
                        'cancelled': '已取消',
                        'cancel_requested': '取消申请中'
                    };
                    return statusMap[status] || '未知状态';
                },

                // 获取状态样式类
                getStatusClass(status) {
                    const classMap = {
                        'pending': 'status-pending',
                        'paid': 'status-paid',
                        'shipped': 'status-shipped',
                        'completed': 'status-completed',
                        'cancelled': 'status-cancelled',
                        'cancel_requested': 'status-cancel-requested'
                    };
                    return classMap[status] || '';
                },

                // 查看订单详情
                async viewOrderDetail(order) {
                    try {
                        const result = await axios.get(`/api/mall/order/${order.id}`);
                        
                        if (result.data.code === 200) {
                            this.orderDetail = result.data.data;
                            this.detailDialogVisible = true;
                        } else {
                            this.$message.error(result.data.message);
                        }
                    } catch (error) {
                        console.error('加载订单详情失败:', error);
                        this.$message.error('加载订单详情失败');
                    }
                },

                // 发货
                async shipOrder(order) { 
                    this.currentOrder = order;
                    this.shipForm = {
                        trackingNumber: '',
                        shippingCompany: '',
                        logisticsInfo: ''
                    };
                    this.shipDialogVisible = true;
                },

                // 确认发货
                async confirmShip() {
                    if (!this.shipForm.trackingNumber.trim()) {
                        this.$message.error('请输入物流单号');
                        return;
                    }

                    try {
                        const result = await axios.post(`/api/mall/order/${this.currentOrder.id}/ship`, {
                            trackingNumber: this.shipForm.trackingNumber,
                            shippingCompany: this.shipForm.shippingCompany,
                            logisticsInfo: this.shipForm.logisticsInfo
                        });
                        
                        if (result.data.code === 200) {
                            this.$message.success(result.data.message);
                            this.shipDialogVisible = false;
                            this.loadOrders();
                        } else {
                            this.$message.error(result.data.message);
                        }
                    } catch (error) {
                        console.error('发货失败:', error);
                        this.$message.error('发货失败');
                    }
                },

                // 编辑物流信息
                async editLogistics(order) {
                    this.currentOrder = order;
                    try {
                        const result = await axios.get(`/api/mall/order/${order.id}`);
                        
                        if (result.data.code === 200) {
                            this.logisticsForm.logisticsInfo = result.data.data.logisticsInfo || '';
                            this.logisticsForm.orderNo = result.data.data.orderNo || '';
                            this.logisticsForm.trackingNumber = result.data.data.trackingNumber || '';
                            this.logisticsForm.shippingCompany = result.data.data.shippingCompany || '';
                            this.logisticsDialogVisible = true;
                        } else {
                            this.$message.error(result.data.message);
                        }
                    } catch (error) {
                        console.error('获取订单信息失败:', error);
                        this.$message.error('获取订单信息失败');
                    }
                },

                // 更新物流信息
                async updateLogistics() {
                    try {
                        const result = await axios.put(`/api/mall/order/${this.currentOrder.id}/logistics`, {
                            logisticsInfo: this.logisticsForm.logisticsInfo
                        });
                        
                        if (result.data.code === 200) {
                            this.$message.success('物流信息更新成功');
                            this.logisticsDialogVisible = false;
                            this.loadOrders();
                        } else {
                            this.$message.error(result.data.message);
                        }
                    } catch (error) {
                        console.error('更新物流信息失败:', error);
                        this.$message.error('更新物流信息失败');
                    }
                },

                // 完成订单
                async completeOrder(order) {
                    try {
                        await this.$confirm('确定要完成这个订单吗？', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        });

                        const result = await axios.post(`/api/mall/order/${order.id}/complete`);
                        
                        if (result.data.code === 200) {
                            this.$message.success(result.data.message);
                            this.loadOrders();
                        } else {
                            this.$message.error(result.data.message);
                        }
                    } catch (error) {
                        if (error !== 'cancel') {
                            console.error('完成订单失败:', error);
                            this.$message.error('完成订单失败');
                        }
                    }
                },

                // 分页处理
                handleSizeChange(val) {
                    this.pageSize = val;
                    this.currentPage = 1;
                    this.loadOrders();
                },

                handleCurrentChange(val) {
                    this.currentPage = val;
                    this.loadOrders();
                },

                // 审批取消申请
                async approveCancelRequest(order, approve) {
                    try {
                        const action = approve ? '通过' : '拒绝';
                        await this.$confirm(`确定要${action}这个取消申请吗？`, '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        });

                        const result = await axios.post(`/api/mall/order/admin/${order.id}/approve-cancel`, { approve });
                        
                        if (result.data.code === 200) {
                            this.$message.success(result.data.message);
                            this.loadOrders();
                        } else {
                            this.$message.error(result.data.message);
                        }
                    } catch (error) {
                        if (error !== 'cancel') {
                            console.error('审批取消申请失败:', error);
                            this.$message.error('审批取消申请失败');
                        }
                    }
                },

                // 格式化日期
                formatDate(dateStr) {
                    const date = new Date(dateStr);
                    return date.toLocaleString('zh-CN');
                }
            }
        });
    </script>
</body>
</html>

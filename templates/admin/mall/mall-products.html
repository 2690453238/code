<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <!-- Quill.js 富文本编辑器 -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <!-- 富文本编辑器组件样式 -->
    <link rel="stylesheet" href="/static/css/rich-editor.css">
    <!-- 富文本编辑器组件 -->
    <script src="/static/js/components/rich-editor.js"></script>
    <style>
        .product-container {
            padding: 20px;
        }
        .product-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-form {
            margin-bottom: 20px;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 4px;
        }
        .product-table {
            margin-bottom: 20px;
        }
        .product-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }
        
        /* 图片上传样式 */
        .image-uploader {
            border: 1px dashed #d9d9d9;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            width: 178px;
            height: 178px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-uploader:hover {
            border-color: #409EFF;
        }
        
        .image-uploader-icon {
            font-size: 28px;
            color: #8c939d;
        }
        
        .uploaded-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .upload-tip {
            margin-top: 8px;
            color: #909399;
            font-size: 12px;
        }
        
        /* 轮播图上传样式 */
        .gallery-uploader {
            margin-top: 10px;
        }
        
        .gallery-uploader .el-upload--picture-card {
            width: 100px;
            height: 100px;
            line-height: 100px;
        }
        
        .gallery-uploader .el-upload-list--picture-card .el-upload-list__item {
            width: 100px;
            height: 100px;
        }
        
        .gallery-preview {
            text-align: center;
        }
        
        /* 商品图片列表样式 */
        .product-images {
            position: relative;
            display: inline-block;
        }
        
        .gallery-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        
        .gallery-indicator:hover {
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div id="app">
        <admin-layout :user-info="userInfo" active-menu="mall-products">
            <template #content>
                <div class="product-container">
                <div class="product-header">
                    <h2>商品管理</h2>
                    <el-button type="primary" @click="showAddDialog">
                        <i class="el-icon-plus"></i>
                        添加商品
                    </el-button>
                </div>

                <!-- 搜索表单 -->
                <el-card class="search-form">
                    <el-form :model="searchForm" inline>
                        <el-form-item label="商品名称">
                            <el-input v-model="searchForm.name" placeholder="请输入商品名称" clearable></el-input>
                        </el-form-item>
                        <el-form-item label="分类">
                            <el-cascader
                                v-model="searchForm.categoryId"
                                :options="categoryTree"
                                :props="cascaderProps"
                                placeholder="请选择分类"
                                clearable
                                style="width: 100%">
                            </el-cascader>
                        </el-form-item>
                        <el-form-item label="状态">
                            <el-select v-model="searchForm.status" placeholder="请选择状态" clearable>
                                <el-option label="上架" :value="1"></el-option>
                                <el-option label="下架" :value="0"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" @click="searchProducts">搜索</el-button>
                            <el-button @click="resetSearch">重置</el-button>
                        </el-form-item>
                    </el-form>
                </el-card>

                <!-- 商品列表 -->
                <el-card>
                    <!-- 批量操作 -->
                    <div style="margin-bottom: 15px;" v-if="selectedProducts.length > 0">
                        <el-button type="danger" @click="batchDelete">
                            <i class="el-icon-delete"></i>
                            批量删除 ({{ selectedProducts.length }})
                        </el-button>
                    </div>
                    
                    <el-table 
                        :data="products" 
                        v-loading="loading"
                        @selection-change="handleSelectionChange">
                        <el-table-column type="selection" width="55"></el-table-column>
                        <el-table-column label="商品图片" width="120">
                            <template slot-scope="scope">
                                <div class="product-images">
                                    <img 
                                        :src="scope.row.mainImage || '/static/image/no-image.png'" 
                                        :alt="scope.row.name"
                                        class="product-image">
                                    <div v-if="scope.row.galleryImages" class="gallery-indicator" @click="previewProductGallery(scope.row)">
                                        <i class="el-icon-picture"></i>
                                        <span>{{ getGalleryCount(scope.row.galleryImages) }}</span>
                                    </div>
                                </div>
                            </template>
                        </el-table-column>
                        <el-table-column prop="name" label="商品名称" min-width="200"></el-table-column>
                        <el-table-column prop="price" label="价格" width="100">
                            <template slot-scope="scope">
                                <span style="color: #f56c6c; font-weight: bold;">
                                    ¥{{ scope.row.price }}
                                </span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="stock" label="库存" width="80"></el-table-column>
                        <el-table-column prop="sales" label="销量" width="80"></el-table-column>
                        <el-table-column prop="status" label="状态" width="80">
                            <template slot-scope="scope">
                                <el-tag :type="scope.row.status === 1 ? 'success' : 'danger'">
                                    {{ scope.row.status === 1 ? '上架' : '下架' }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="createTime" label="创建时间" width="160">
                            <template slot-scope="scope">
                                {{ formatDate(scope.row.createTime) }}
                            </template>
                        </el-table-column>
                        <el-table-column label="操作" width="200" fixed="right">
                            <template slot-scope="scope">
                                <el-button type="text" @click="editProduct(scope.row)">编辑</el-button>
                                <el-button 
                                    type="text" 
                                    @click="toggleStatus(scope.row)"
                                    :style="{ color: scope.row.status === 1 ? '#f56c6c' : '#67c23a' }">
                                    {{ scope.row.status === 1 ? '下架' : '上架' }}
                                </el-button>
                                <el-button type="text" @click="deleteProduct(scope.row)" style="color: #f56c6c;">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>

                    <!-- 分页 -->
                    <el-pagination
                        v-if="total > 0"
                        @size-change="handleSizeChange"
                        @current-change="handleCurrentChange"
                        :current-page="currentPage"
                        :page-sizes="[10, 20, 50, 100]"
                        :page-size="pageSize"
                        layout="total, sizes, prev, pager, next, jumper"
                        :total="total"
                        style="margin-top: 20px; text-align: center;">
                    </el-pagination>
                </el-card>

                <!-- 添加/编辑商品对话框 -->
                <el-dialog
                    :title="dialogTitle"
                    :visible.sync="dialogVisible"
                    width="60%">
                    <el-form :model="productForm" :rules="productRules" ref="productForm" label-width="100px">
                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="商品名称" prop="name">
                                    <el-input v-model="productForm.name" placeholder="请输入商品名称"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="分类" prop="categoryId">
                                    <el-cascader
                                        v-model="productForm.categoryId"
                                        :options="categoryTree"
                                        :props="cascaderProps"
                                        placeholder="请选择分类"
                                        style="width: 100%">
                                    </el-cascader>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row :gutter="20">
                            <el-col :span="8">
                                <el-form-item label="价格" prop="price">
                                    <el-input-number v-model="productForm.price" :min="0" :precision="2" style="width: 100%"></el-input-number>
                                </el-form-item>
                            </el-col>
                            <el-col :span="8">
                                <el-form-item label="原价" prop="originalPrice">
                                    <el-input-number v-model="productForm.originalPrice" :min="0" :precision="2" style="width: 100%"></el-input-number>
                                </el-form-item>
                            </el-col>
                            <el-col :span="8">
                                <el-form-item label="库存" prop="stock">
                                    <el-input-number v-model="productForm.stock" :min="0" style="width: 100%"></el-input-number>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-form-item label="商品描述" prop="description">
                            <div id="description-editor" style="height: 300px;"></div>
                        </el-form-item>
                        <el-form-item label="主图" prop="mainImage">
                            <el-upload
                                class="image-uploader"
                                :action="'/open/upload'"
                                :show-file-list="false"
                                :on-success="handleMainImageSuccess"
                                :before-upload="beforeImageUpload"
                                accept="image/*">
                                <img v-if="productForm.mainImage" :src="productForm.mainImage" class="uploaded-image">
                                <i v-else class="el-icon-plus image-uploader-icon"></i>
                            </el-upload>
                            <div class="upload-tip">支持 jpg、png 格式，大小不超过 5MB</div>
                        </el-form-item>
                        <el-form-item label="轮播图" prop="galleryImages">
                            <div class="gallery-uploader">
                                <el-upload
                                    :action="'/open/upload'"
                                    :file-list="galleryFileList"
                                    :on-success="handleGallerySuccess"
                                    :on-remove="handleGalleryRemove"
                                    :before-upload="beforeImageUpload"
                                    :on-preview="handleGalleryPreview"
                                    :auto-upload="true"
                                    list-type="picture-card"
                                    accept="image/*"
                                    :limit="9">
                                    <i class="el-icon-plus"></i>
                                </el-upload>
                                <div class="upload-tip">最多上传9张图片，支持 jpg、png 格式，每张图片大小不超过 5MB</div>
                            </div>
                        </el-form-item>
                        <el-form-item label="状态" prop="status">
                            <el-radio-group v-model="productForm.status">
                                <el-radio :label="1">上架</el-radio>
                                <el-radio :label="0">下架</el-radio>
                            </el-radio-group>
                        </el-form-item>
                    </el-form>
                    <div slot="footer" class="dialog-footer">
                        <el-button @click="dialogVisible = false">取消</el-button>
                        <el-button type="primary" @click="saveProduct">确定</el-button>
                    </div>
                </el-dialog>

                <!-- 轮播图预览对话框 -->
                <el-dialog
                    title="轮播图预览"
                    :visible.sync="galleryPreviewVisible"
                    width="60%">
                    <div class="gallery-preview">
                        <el-carousel :autoplay="false" height="400px" indicator-position="outside">
                            <el-carousel-item v-for="(image, index) in galleryPreviewImages" :key="index">
                                <img :src="image.url" :alt="image.name" style="width: 100%; height: 100%; object-fit: contain;">
                            </el-carousel-item>
                        </el-carousel>
                    </div>
                </el-dialog>
                </div>
            </template>
        </admin-layout>
    </div>

    <script src="https://unpkg.com/vue@2/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script> 
    <script>
        new Vue({
            el: '#app', 
            data() {
                return {
                    userInfo: {},
                    products: [],
                    categories: [],
                    categoryTree: [],
                    loading: false,
                    currentPage: 1,
                    pageSize: 10,
                    total: 0,
                    selectedProducts: [],
                    searchForm: {
                        name: '',
                        categoryId: [],  // 改为数组格式，支持级联选择器
                        status: ''
                    },
                    cascaderProps: {
                        value: 'id',
                        label: 'name',
                        children: 'children',
                        checkStrictly: true
                    },
                    dialogVisible: false,
                    dialogTitle: '添加商品',
                    productForm: {
                        id: null,
                        name: '',
                        categoryId: [],  // 改为数组格式，支持级联选择器
                        price: 0,
                        originalPrice: 0,
                        stock: 0,
                        description: '',
                        mainImage: '',
                        galleryImages: '',  // 轮播图JSON字符串
                        status: 1
                    },
                    galleryFileList: [],  // 轮播图文件列表
                    galleryPreviewVisible: false,  // 轮播图预览对话框
                    galleryPreviewImages: [],  // 轮播图预览图片列表
                    richEditor: null,
                    productRules: {
                        name: [
                            { required: true, message: '请输入商品名称', trigger: 'blur' }
                        ],
                        categoryId: [
                            { required: true, message: '请选择分类', trigger: 'change' }
                        ],
                        price: [
                            { required: true, message: '请输入价格', trigger: 'blur' }
                        ]
                    }
                }
            },
            mounted() {
                this.checkAuth();
                this.loadCategories();
                this.loadProducts();
            },
            methods: {
                // 检查登录状态
                checkAuth() {
                    const userInfo = localStorage.getItem('userInfo');
                    if (userInfo) {
                        this.userInfo = JSON.parse(userInfo); 
                    } else {
                        this.$message.warning('请先登录');
                        window.location.href = '/login';
                    }
                },

                // 加载分类列表
                async loadCategories() {
                    try {
                        const response = await fetch('/api/mall/category/tree');
                        const result = await response.json();
                        
                        if (result.code === 200) {
                            this.categoryTree = result.data;
                            // 为了兼容性，也保留扁平化的分类列表
                            this.categories = this.flattenCategories(result.data);
                        }
                    } catch (error) {
                        console.error('加载分类失败:', error);
                    }
                },

                // 将树形结构扁平化
                flattenCategories(categories, level = 0) {
                    let result = [];
                    categories.forEach(category => {
                        const item = {
                            ...category,
                            level: level,
                            displayName: '　'.repeat(level) + category.name
                        };
                        result.push(item);
                        if (category.children && category.children.length > 0) {
                            result = result.concat(this.flattenCategories(category.children, level + 1));
                        }
                    });
                    return result;
                },

                // 加载商品列表
                async loadProducts() {
                    this.loading = true;
                    try {
                        // 处理搜索表单数据，将级联选择器的数组转换为单个分类ID
                        const searchParams = { ...this.searchForm };
                        if (Array.isArray(searchParams.categoryId) && searchParams.categoryId.length > 0) {
                            // 取数组的最后一个元素作为分类ID
                            searchParams.categoryId = searchParams.categoryId[searchParams.categoryId.length - 1];
                        } else if (Array.isArray(searchParams.categoryId)) {
                            // 如果数组为空，设置为空字符串
                            searchParams.categoryId = '';
                        }
                        
                        const params = new URLSearchParams({
                            pageNum: this.currentPage,
                            pageSize: this.pageSize,
                            keyword: searchParams.name || '',
                            categoryId: searchParams.categoryId || '',
                            status: searchParams.status === '' ? '' : searchParams.status
                        });

                        const response = await fetch(`/api/supplier/products?${params}`);
                        const result = await response.json();
                        
                        if (result.code === 200) {
                            this.products = result.data.rows;
                            this.total = result.data.total;
                        } else {
                            this.$message.error(result.message);
                        }
                    } catch (error) {
                        console.error('加载商品列表失败:', error);
                        this.$message.error('加载商品列表失败');
                    } finally {
                        this.loading = false;
                    }
                },

                // 搜索商品
                searchProducts() {
                    this.currentPage = 1;
                    this.loadProducts();
                },

                // 重置搜索
                resetSearch() {
                    this.searchForm = {
                        name: '',
                        categoryId: [],  // 重置为数组格式
                        status: ''
                    };
                    this.currentPage = 1;
                    this.loadProducts();
                },

                // 显示添加对话框
                showAddDialog() {
                    this.dialogTitle = '添加商品';
                    this.productForm = {
                        id: null,
                        name: '',
                        categoryId: [],  // 重置为数组格式
                        price: 0,
                        originalPrice: 0,
                        stock: 0,
                        description: '',
                        mainImage: '',
                        galleryImages: '',  // 重置轮播图
                        status: 1
                    };
                    this.galleryFileList = [];  // 重置轮播图文件列表
                    this.dialogVisible = true;
                    this.$nextTick(() => {
                        this.initRichEditor();
                    });
                },

                // 编辑商品
                async editProduct(product) {
                    this.dialogTitle = '编辑商品';
                    const response = await fetch(`/api/mall/product/${product.id}`);
                    const result = await response.json();
                    if (result.code !== 200 || !result.data) {
                        this.$message.error(result.message || '鑾峰彇鍟嗗搧璇︽儏澶辫触');
                        return;
                    }
                    const detail = result.data;
                    this.productForm = { ...detail };
                    this.productForm.description = detail.description || '';
                    // 将单个分类ID转换为数组格式，用于级联选择器
                    this.productForm.categoryId = this.getCategoryPath(detail.categoryId);
                    
                    // 处理轮播图数据
                    this.galleryFileList = [];
                    if (detail.galleryImages) {
                        try {
                            const galleryImages = JSON.parse(detail.galleryImages);
                            if (Array.isArray(galleryImages)) {
                                this.galleryFileList = galleryImages.map((image, index) => ({
                                    name: `轮播图${index + 1}`,
                                    url: image,
                                    uid: Date.now() + index
                                }));
                            }
                        } catch (e) {
                            console.error('解析轮播图数据失败:', e);
                        }
                    }
                    
                    this.dialogVisible = true;
                    this.$nextTick(() => {
                        this.initRichEditor();
                    });
                },

                // 获取分类路径（将分类ID转换为路径数组）
                getCategoryPath(categoryId) {
                    if (!categoryId) return [];
                    
                    // 在分类树中查找该分类的完整路径
                    const findPath = (categories, targetId, path = []) => {
                        for (let category of categories) {
                            const currentPath = [...path, category.id];
                            if (category.id === targetId) {
                                return currentPath;
                            }
                            if (category.children && category.children.length > 0) {
                                const result = findPath(category.children, targetId, currentPath);
                                if (result) return result;
                            }
                        }
                        return null;
                    };
                    
                    return findPath(this.categoryTree, categoryId) || [categoryId];
                },

                // 初始化富文本编辑器
                initRichEditor() {
                    if (this.richEditor) {
                        this.richEditor.destroy();
                    }
                    
                    this.richEditor = new RichEditor({
                        container: '#description-editor',
                        placeholder: '请输入商品详细描述...',
                        height: 300,
                        value: this.productForm.description,
                        onChange: (content) => {
                            this.productForm.description = content;
                        }
                    });
                },

                // 图片上传前验证
                beforeImageUpload(file) {
                    const isImage = file.type.startsWith('image/');
                    const isLt5M = file.size / 1024 / 1024 < 5;

                    if (!isImage) {
                        this.$message.error('只能上传图片文件!');
                        return false;
                    }
                    if (!isLt5M) {
                        this.$message.error('图片大小不能超过 5MB!');
                        return false;
                    }
                    return true;
                },

                // 主图上传成功回调
                handleMainImageSuccess(response, file) {
                    if (response.code === 200) {
                        this.productForm.mainImage = response.data.url;
                        this.$message.success('主图上传成功');
                    } else {
                        this.$message.error(response.message || '主图上传失败');
                    }
                },

                // 轮播图上传成功回调
                handleGallerySuccess(response, file) {
                    if (response.code === 200) {
                        this.$message.success('轮播图上传成功');
                        
                        // 使用Vue.set确保响应式更新
                        const fileIndex = this.galleryFileList.findIndex(f => f.uid === file.uid);
                        if (fileIndex !== -1) {
                            this.$set(this.galleryFileList, fileIndex, {
                                ...this.galleryFileList[fileIndex],
                                url: response.data.url,
                                status: 'success'
                            });
                        }else{
                            this.galleryFileList.push({
                                name: file.name,
                                url: response.data.url,
                                status: 'success'
                            });
                        }
                        
                        // 更新轮播图数据
                        this.updateGalleryImages();
                    } else {
                        this.$message.error(response.message || '轮播图上传失败');
                    }
                },

                // 轮播图删除回调
                handleGalleryRemove(file, fileList) {
                    this.galleryFileList = fileList;
                    this.updateGalleryImages();
                },

                // 轮播图预览
                handleGalleryPreview(file) {
                    this.galleryPreviewImages = this.galleryFileList.map(item => ({
                        name: item.name,
                        url: item.url
                    }));
                    this.galleryPreviewVisible = true;
                },

                // 更新轮播图数据
                updateGalleryImages() {
                    const galleryUrls = this.galleryFileList.map(file => file.url);
                    const validUrls = galleryUrls.filter(url => url);
                    this.productForm.galleryImages = JSON.stringify(validUrls);
                },

                // 保存商品
                async saveProduct() {
                    try {
                        await this.$refs.productForm.validate();
                        
                        // 获取富文本编辑器内容
                        if (this.richEditor) {
                            this.productForm.description = this.richEditor.getContent();
                        }
                        
                        // 更新轮播图数据
                        this.updateGalleryImages();
                        
                        // 处理级联选择器的分类数据
                        const formData = { ...this.productForm };
                        if (Array.isArray(formData.categoryId) && formData.categoryId.length > 0) {
                            // 取数组的最后一个元素作为最终分类ID
                            formData.categoryId = formData.categoryId[formData.categoryId.length - 1];
                        }
                        
                        const url = this.productForm.id ? 
                            `/api/mall/product/${this.productForm.id}` : 
                            '/api/mall/product/';
                        const method = this.productForm.id ? 'PUT' : 'POST';
                        
                        const response = await fetch(url, {
                            method: method,
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(formData)
                        });
                        
                        const result = await response.json();
                        if (result.code === 200) {
                            this.$message.success(result.message);
                            this.dialogVisible = false;
                            this.loadProducts();
                        } else {
                            this.$message.error(result.message);
                        }
                    } catch (error) {
                        console.error('保存商品失败:', error);
                        this.$message.error('保存商品失败');
                    }
                },

                // 切换状态
                async toggleStatus(product) {
                    try {
                        const newStatus = product.status === 1 ? 0 : 1;
                        const response = await fetch(`/api/mall/product/${product.id}/status`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ status: newStatus })
                        });
                        
                        const result = await response.json();
                        if (result.code === 200) {
                            this.$message.success(result.message);
                            this.loadProducts();
                        } else {
                            this.$message.error(result.message);
                        }
                    } catch (error) {
                        console.error('切换状态失败:', error);
                        this.$message.error('切换状态失败');
                    }
                },

                // 删除商品
                async deleteProduct(product) {
                    try {
                        await this.$confirm('确定要删除这个商品吗？', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        });

                        const response = await fetch(`/api/mall/product/${product.id}`, {
                            method: 'DELETE'
                        });
                        
                        const result = await response.json();
                        if (result.code === 200) {
                            this.$message.success(result.message);
                            this.loadProducts();
                        } else {
                            this.$message.error(result.message);
                        }
                    } catch (error) {
                        if (error !== 'cancel') {
                            console.error('删除商品失败:', error);
                            this.$message.error('删除商品失败');
                        }
                    }
                },

                // 选择变化处理
                handleSelectionChange(selection) {
                    this.selectedProducts = selection;
                },

                // 批量删除
                async batchDelete() {
                    if (this.selectedProducts.length === 0) {
                        this.$message.warning('请选择要删除的商品');
                        return;
                    }

                    try {
                        await this.$confirm(`确定要删除选中的 ${this.selectedProducts.length} 个商品吗？`, '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        });

                        const ids = this.selectedProducts.map(item => item.id);
                        const response = await fetch('/api/mall/product/batch', {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ ids })
                        });
                        
                        const result = await response.json();
                        if (result.code === 200) {
                            this.$message.success(result.message);
                            this.loadProducts();
                        } else {
                            this.$message.error(result.message);
                        }
                    } catch (error) {
                        if (error !== 'cancel') {
                            console.error('批量删除失败:', error);
                            this.$message.error('批量删除失败');
                        }
                    }
                },

                // 分页处理
                handleSizeChange(val) {
                    this.pageSize = val;
                    this.currentPage = 1;
                    this.loadProducts();
                },

                handleCurrentChange(val) {
                    this.currentPage = val;
                    this.loadProducts();
                },

                // 格式化日期
                formatDate(dateStr) {
                    const date = new Date(dateStr);
                    return date.toLocaleString('zh-CN');
                },

                // 获取轮播图数量
                getGalleryCount(galleryImages) {
                    if (!galleryImages) return 0;
                    try {
                        const images = JSON.parse(galleryImages);
                        return Array.isArray(images) ? images.length : 0;
                    } catch (e) {
                        return 0;
                    }
                },

                // 预览商品轮播图
                previewProductGallery(product) {
                    if (!product.galleryImages) {
                        this.$message.warning('该商品暂无轮播图');
                        return;
                    }
                    
                    try {
                        const galleryImages = JSON.parse(product.galleryImages);
                        if (Array.isArray(galleryImages) && galleryImages.length > 0) {
                            this.galleryPreviewImages = galleryImages.map((url, index) => ({
                                name: `轮播图${index + 1}`,
                                url: url
                            }));
                            this.galleryPreviewVisible = true;
                        } else {
                            this.$message.warning('该商品暂无轮播图');
                        }
                    } catch (e) {
                        console.error('解析轮播图数据失败:', e);
                        this.$message.error('轮播图数据格式错误');
                    }
                }
            }
        });
    </script>
</body>
</html>

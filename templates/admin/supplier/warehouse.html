<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓库管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .page-container { padding: 20px; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .toolbar-left { display: flex; align-items: center; gap: 12px; }
        .stats-row { display: flex; gap: 16px; margin-bottom: 20px; }
        .stat-mini { flex: 1; background: #fff; border-radius: 8px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); min-width: 140px; }
        .stat-mini .label { font-size: 13px; color: #64748b; }
        .stat-mini .num { font-size: 24px; font-weight: 700; color: #0f172a; margin-top: 4px; }
    </style>
</head>
<body>
<div id="app">
    <admin-layout :active-menu="'community-warehouse'">
        <template #content>
            <div class="page-container" v-loading="loading">
                <h2 style="margin-bottom:16px">仓库管理</h2>

                <div class="stats-row" v-if="stats">
                    <div class="stat-mini">
                        <div class="label">商品种类</div>
                        <div class="num">{{ stats.totalItems }}</div>
                    </div>
                    <div class="stat-mini">
                        <div class="label">总库存量</div>
                        <div class="num">{{ stats.totalQuantity }}</div>
                    </div>
                    <div class="stat-mini">
                        <div class="label">库存总价值</div>
                        <div class="num">¥{{ stats.totalValue }}</div>
                    </div>
                </div>

                <el-card shadow="never">
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <el-input v-model="keyword" placeholder="搜索商品名称" size="small"
                                style="width:240px" clearable @keyup.enter.native="loadData">
                                <el-button slot="append" icon="el-icon-search" @click="loadData"></el-button>
                            </el-input>
                        </div>
                    </div>

                    <el-table :data="list" stripe size="small" v-loading="tableLoading">
                        <el-table-column prop="productName" label="商品名称" min-width="200">
                            <template slot-scope="s">
                                <div style="display:flex;align-items:center;gap:10px">
                                    <span>{{ s.row.productName }}</span>
                                </div>
                            </template>
                        </el-table-column>
                        <el-table-column prop="quantity" label="库存数量" width="120" align="right">
                            <template slot-scope="s">
                                <span style="font-weight:600;font-size:16px;color:#0f172a">{{ s.row.quantity }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="costPrice" label="进价" width="120" align="right">
                            <template slot-scope="s">
                                <span style="color:#64748b">¥{{ s.row.costPrice }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column label="入库时间" width="180" align="center">
                            <template slot-scope="s">{{ s.row.created_at }}</template>
                        </el-table-column>
                        <el-table-column label="更新时间" width="180" align="center">
                            <template slot-scope="s">{{ s.row.updated_at }}</template>
                        </el-table-column>
                    </el-table>

                    <div style="text-align:center;margin-top:16px">
                        <el-pagination
                            @current-change="onPageChange"
                            :current-page="page"
                            :page-size="limit"
                            :total="total"
                            layout="prev, pager, next, total">
                        </el-pagination>
                    </div>

                    <div v-if="list.length === 0 && !tableLoading" style="text-align:center;padding:40px 0;color:#94a3b8">
                        <i class="el-icon-info" style="font-size:36px;display:block;margin-bottom:8px"></i>
                        <p>仓库暂无商品，请先在智能选品中采购</p>
                    </div>
                </el-card>
            </div>
        </template>
    </admin-layout>
</div>

<script src="/static/js/vue.js"></script>
<script src="/static/js/element-ui.min.js"></script>
<script src="/static/js/axios.min.js"></script>
<script src="/static/js/config/layout-config.js"></script>
<script src="/static/js/components/layout.js"></script>
<script>
new Vue({
    el: '#app',
    data: {
        loading: false,
        tableLoading: false,
        stats: null,
        list: [],
        page: 1,
        limit: 10,
        total: 0,
        keyword: '',
    },
    mounted: function () {
        this.loadData();
    },
    methods: {
        loadData: function () {
            var self = this;
            self.tableLoading = true;
            self.loading = true;

            axios.get('/api/supplier/warehouse/stats')
                .then(function (res) {
                    if (res.data.code === 200) self.stats = res.data.data;
                })
                .catch(function () {});

            axios.get('/api/supplier/warehouse', {
                params: { page: self.page, limit: self.limit, keyword: self.keyword }
            })
                .then(function (res) {
                    if (res.data.code === 200) {
                        self.list = res.data.data.rows || [];
                        self.total = res.data.data.total || 0;
                        self.page = res.data.data.page || 1;
                    } else {
                        self.$message.error(res.data.message);
                    }
                })
                .catch(function () {
                    self.$message.error('加载仓库数据失败');
                })
                .finally(function () {
                    self.tableLoading = false;
                    self.loading = false;
                });
        },
        onPageChange: function (p) {
            this.page = p;
            this.loadData();
        },
    },
});
</script>
</body>
</html>

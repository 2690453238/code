<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>售后管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .page-container { padding: 20px; }
        .search-card, .table-card { margin-bottom: 20px; }
        .dialog-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        .order-items { border: 1px solid #ebeef5; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .order-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f5f7fa; }
        .order-item:last-child { border-bottom: none; }
        .order-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
        .refund-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .refund-detail-item { display: flex; flex-direction: column; gap: 4px; }
        .refund-detail-item .label { font-size: 12px; color: #909399; }
        .refund-detail-item .value { font-size: 14px; color: #303133; }
    </style>
</head>
<body>
    <div id="app">
        <admin-layout :active-menu="activeMenu">
            <template #content>
                <div class="page-container">
                    <el-card class="search-card">
                        <el-form :inline="true" :model="searchForm">
                            <el-form-item label="订单号">
                                <el-input v-model="searchForm.orderNo" placeholder="请输入订单号" clearable></el-input>
                            </el-form-item>
                            <el-form-item label="用户">
                                <el-input v-model="searchForm.username" placeholder="请输入用户名" clearable></el-input>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="primary" @click="loadData">搜索</el-button>
                                <el-button @click="resetSearch">重置</el-button>
                            </el-form-item>
                        </el-form>
                    </el-card>

                    <el-card class="table-card">
                        <div slot="header">
                            <el-tabs v-model="activeTab" @tab-click="handleTabChange">
                                <el-tab-pane label="取消申请" name="cancel"></el-tab-pane>
                                <el-tab-pane label="退款申请" name="refund"></el-tab-pane>
                            </el-tabs>
                        </div>

                        <!-- 取消申请列表 -->
                        <div v-show="activeTab === 'cancel'">
                            <el-table :data="cancelTableData" v-loading="loadingCancel" stripe>
                                <el-table-column prop="orderNo" label="订单号" min-width="180"></el-table-column>
                                <el-table-column prop="username" label="用户" width="120"></el-table-column>
                                <el-table-column prop="receiverName" label="收货人" width="120"></el-table-column>
                                <el-table-column prop="receiverPhone" label="联系电话" width="140"></el-table-column>
                                <el-table-column prop="payAmount" label="实付金额" width="120">
                                    <template slot-scope="scope">¥{{ scope.row.payAmount }}</template>
                                </el-table-column>
                                <el-table-column prop="updateTime" label="申请时间" min-width="160"></el-table-column>
                                <el-table-column label="操作" width="220" fixed="right">
                                    <template slot-scope="scope">
                                        <el-button type="text" @click="viewCancelDetail(scope.row)">查看详情</el-button>
                                        <el-button type="text" @click="openCancelHandleDialog(scope.row)">售后处理</el-button>
                                    </template>
                                </el-table-column>
                            </el-table>
                        </div>

                        <!-- 退款申请列表 -->
                        <div v-show="activeTab === 'refund'">
                            <el-table :data="refundTableData" v-loading="loadingRefund" stripe>
                                <el-table-column prop="refundNo" label="退款单号" min-width="180"></el-table-column>
                                <el-table-column prop="orderNo" label="订单号" width="160"></el-table-column>
                                <el-table-column prop="username" label="用户" width="100"></el-table-column>
                                <el-table-column prop="type" label="类型" width="90">
                                    <template slot-scope="scope">{{ scope.row.type === 'return_refund' ? '退货退款' : '仅退款' }}</template>
                                </el-table-column>
                                <el-table-column prop="reason" label="原因" min-width="160" show-overflow-tooltip></el-table-column>
                                <el-table-column prop="amount" label="退款金额" width="100">
                                    <template slot-scope="scope">¥{{ scope.row.amount }}</template>
                                </el-table-column>
                                <el-table-column prop="status" label="状态" width="90">
                                    <template slot-scope="scope">
                                        <el-tag :type="scope.row.status === 'pending' ? 'warning' : scope.row.status === 'approved' ? 'success' : scope.row.status === 'rejected' ? 'danger' : 'info'" size="mini">
                                            {{ scope.row.status === 'pending' ? '待审核' : scope.row.status === 'approved' ? '已通过' : scope.row.status === 'rejected' ? '已拒绝' : '已撤销' }}
                                        </el-tag>
                                    </template>
                                </el-table-column>
                                <el-table-column prop="createTime" label="申请时间" min-width="160"></el-table-column>
                                <el-table-column label="操作" width="160" fixed="right">
                                    <template slot-scope="scope">
                                        <el-button v-if="scope.row.status === 'pending'" type="text" @click="openRefundHandleDialog(scope.row)">审核处理</el-button>
                                        <el-button type="text" @click="viewRefundDetail(scope.row)">详情</el-button>
                                    </template>
                                </el-table-column>
                            </el-table>
                        </div>
                    </el-card>

                    <!-- 取消申请 - 详情对话框 -->
                    <el-dialog title="售后订单详情" :visible.sync="cancelDetailVisible" width="760px">
                        <div v-if="currentCancelOrder">
                            <el-descriptions :column="2" border>
                                <el-descriptions-item label="订单号">{{ currentCancelOrder.orderNo }}</el-descriptions-item>
                                <el-descriptions-item label="订单状态">{{ currentCancelOrder.status }}</el-descriptions-item>
                                <el-descriptions-item label="收货人">{{ currentCancelOrder.receiverName }}</el-descriptions-item>
                                <el-descriptions-item label="联系电话">{{ currentCancelOrder.receiverPhone }}</el-descriptions-item>
                                <el-descriptions-item label="实付金额">¥{{ currentCancelOrder.payAmount }}</el-descriptions-item>
                                <el-descriptions-item label="创建时间">{{ currentCancelOrder.createTime }}</el-descriptions-item>
                                <el-descriptions-item label="收货地址" :span="2">{{ currentCancelOrder.address ? currentCancelOrder.address.address : '' }}</el-descriptions-item>
                                <el-descriptions-item label="售后回复" :span="2">{{ currentCancelOrder.remark || '暂无回复' }}</el-descriptions-item>
                            </el-descriptions>
                            <div class="order-items">
                                <div class="order-item" v-for="item in currentCancelOrder.items || []" :key="item.id">
                                    <img :src="item.image || '/static/image/profile.png'" alt="商品图片">
                                    <div>
                                        <div>{{ item.productName }}</div>
                                        <div style="color:#909399;font-size:12px;">数量：{{ item.quantity }} | 单价：¥{{ item.price }}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div slot="footer" class="dialog-footer">
                            <el-button @click="cancelDetailVisible = false">关闭</el-button>
                        </div>
                    </el-dialog>

                    <!-- 取消申请 - 处理对话框 -->
                    <el-dialog title="售后处理" :visible.sync="cancelHandleVisible" width="520px">
                        <el-form :model="cancelHandleForm" label-width="100px">
                            <el-form-item label="处理结果">
                                <el-radio-group v-model="cancelHandleForm.approve">
                                    <el-radio :label="true">同意取消</el-radio>
                                    <el-radio :label="false">驳回申请</el-radio>
                                </el-radio-group>
                            </el-form-item>
                            <el-form-item label="处理回复">
                                <el-input v-model="cancelHandleForm.replyContent" type="textarea" :rows="4" maxlength="200" show-word-limit placeholder="请输入售后处理回复"></el-input>
                            </el-form-item>
                        </el-form>
                        <div slot="footer" class="dialog-footer">
                            <el-button @click="cancelHandleVisible = false">取消</el-button>
                            <el-button type="primary" :loading="submittingCancel" @click="submitCancelHandle">提交处理</el-button>
                        </div>
                    </el-dialog>

                    <!-- 退款申请 - 详情对话框 -->
                    <el-dialog title="退款详情" :visible.sync="refundDetailVisible" width="560px">
                        <div v-if="currentRefund">
                            <div class="refund-detail-grid">
                                <div class="refund-detail-item">
                                    <span class="label">退款单号</span>
                                    <span class="value">{{ currentRefund.refundNo }}</span>
                                </div>
                                <div class="refund-detail-item">
                                    <span class="label">订单号</span>
                                    <span class="value">{{ currentRefund.orderNo }}</span>
                                </div>
                                <div class="refund-detail-item">
                                    <span class="label">退款类型</span>
                                    <span class="value">{{ currentRefund.type === 'return_refund' ? '退货退款' : '仅退款' }}</span>
                                </div>
                                <div class="refund-detail-item">
                                    <span class="label">退款金额</span>
                                    <span class="value" style="color:#e6a23c;font-weight:700;">¥{{ currentRefund.amount }}</span>
                                </div>
                                <div class="refund-detail-item">
                                    <span class="label">退款原因</span>
                                    <span class="value">{{ currentRefund.reason }}</span>
                                </div>
                                <div class="refund-detail-item">
                                    <span class="label">申请时间</span>
                                    <span class="value">{{ currentRefund.createTime }}</span>
                                </div>
                            </div>
                            <div v-if="currentRefund.description" style="margin-top:16px;padding-top:16px;border-top:1px solid #ebeef5;">
                                <div style="font-size:12px;color:#909399;margin-bottom:4px;">补充说明</div>
                                <div style="font-size:14px;color:#303133;">{{ currentRefund.description }}</div>
                            </div>
                            <div v-if="currentRefund.adminReply" style="margin-top:16px;padding:12px;background:#fdf5f5;border-radius:8px;">
                                <div style="font-size:12px;color:#909399;margin-bottom:4px;">审核回复</div>
                                <div style="font-size:14px;color:#7d4040;">{{ currentRefund.adminReply }}</div>
                            </div>
                        </div>
                        <div slot="footer" class="dialog-footer">
                            <el-button @click="refundDetailVisible = false">关闭</el-button>
                        </div>
                    </el-dialog>

                    <!-- 退款申请 - 审核对话框 -->
                    <el-dialog title="审核退款申请" :visible.sync="refundHandleVisible" width="520px">
                        <el-form :model="refundHandleForm" label-width="100px">
                            <el-form-item label="处理结果">
                                <el-radio-group v-model="refundHandleForm.approve">
                                    <el-radio :label="true">同意退款</el-radio>
                                    <el-radio :label="false">驳回申请</el-radio>
                                </el-radio-group>
                            </el-form-item>
                            <el-form-item label="处理回复">
                                <el-input v-model="refundHandleForm.reply" type="textarea" :rows="4" maxlength="200" show-word-limit placeholder="请输入处理回复"></el-input>
                            </el-form-item>
                        </el-form>
                        <div slot="footer" class="dialog-footer">
                            <el-button @click="refundHandleVisible = false">取消</el-button>
                            <el-button type="primary" :loading="submittingRefund" @click="submitRefundHandle">提交处理</el-button>
                        </div>
                    </el-dialog>

                </div>
            </template>
        </admin-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    activeMenu: 'community-after-sale',
                    activeTab: 'cancel',
                    searchForm: { orderNo: '', username: '' },
                    // 取消申请
                    loadingCancel: false,
                    cancelTableData: [],
                    cancelDetailVisible: false,
                    cancelHandleVisible: false,
                    submittingCancel: false,
                    currentCancelOrder: null,
                    cancelHandleForm: { id: null, approve: true, replyContent: '' },
                    // 退款申请
                    loadingRefund: false,
                    refundTableData: [],
                    refundDetailVisible: false,
                    refundHandleVisible: false,
                    submittingRefund: false,
                    currentRefund: null,
                    refundHandleForm: { id: null, approve: true, reply: '' }
                };
            },
            mounted() {
                this.loadCancelData();
            },
            methods: {
                handleTabChange() {
                    if (this.activeTab === 'cancel') this.loadCancelData();
                    else this.loadRefundData();
                },
                loadData() {
                    if (this.activeTab === 'cancel') this.loadCancelData();
                    else this.loadRefundData();
                },
                resetSearch() {
                    this.searchForm = { orderNo: '', username: '' };
                    this.loadData();
                },
                // 取消申请相关
                loadCancelData() {
                    this.loadingCancel = true;
                    axios.get('/api/mall/order/admin/cancel-requests')
                        .then(response => {
                            if (response.data.code === 200) {
                                const rows = response.data.data || [];
                                this.cancelTableData = rows.filter(row => {
                                    const hitOrder = !this.searchForm.orderNo || (row.orderNo || '').includes(this.searchForm.orderNo);
                                    const hitUser = !this.searchForm.username || (row.username || '').includes(this.searchForm.username);
                                    return hitOrder && hitUser;
                                });
                            } else { this.$message.error(response.data.message); }
                        })
                        .catch(() => { this.$message.error('加载售后订单失败'); })
                        .finally(() => { this.loadingCancel = false; });
                },
                viewCancelDetail(row) {
                    axios.get(`/api/mall/order/${row.id}`)
                        .then(response => {
                            if (response.data.code === 200) {
                                this.currentCancelOrder = response.data.data;
                                this.cancelDetailVisible = true;
                            } else { this.$message.error(response.data.message); }
                        })
                        .catch(() => { this.$message.error('加载订单详情失败'); });
                },
                openCancelHandleDialog(row) {
                    this.cancelHandleForm = { id: row.id, approve: true, replyContent: '' };
                    this.cancelHandleVisible = true;
                },
                submitCancelHandle() {
                    this.submittingCancel = true;
                    axios.post(`/api/mall/order/admin/${this.cancelHandleForm.id}/approve-cancel`, {
                        approve: this.cancelHandleForm.approve,
                        replyContent: this.cancelHandleForm.replyContent
                    })
                        .then(response => {
                            if (response.data.code === 200) {
                                this.$message.success(response.data.message);
                                this.cancelHandleVisible = false;
                                this.loadCancelData();
                            } else { this.$message.error(response.data.message); }
                        })
                        .catch(() => { this.$message.error('售后处理失败'); })
                        .finally(() => { this.submittingCancel = false; });
                },
                // 退款申请相关
                loadRefundData() {
                    this.loadingRefund = true;
                    const params = { page: 1, limit: 100 };
                    const searchRefundKeyword = this.searchForm.orderNo || this.searchForm.username;
                    axios.get('/api/mall/refund/admin/list', { params })
                        .then(response => {
                            if (response.data.code === 200) {
                                let rows = response.data.data.rows || [];
                                if (searchRefundKeyword) {
                                    const kw = searchRefundKeyword;
                                    rows = rows.filter(row => (row.refundNo || '').includes(kw) || (row.orderNo || '').includes(kw) || (row.username || '').includes(kw));
                                }
                                this.refundTableData = rows;
                            } else { this.$message.error(response.data.message); }
                        })
                        .catch(() => { this.$message.error('加载退款申请失败'); })
                        .finally(() => { this.loadingRefund = false; });
                },
                viewRefundDetail(row) {
                    this.currentRefund = row;
                    this.refundDetailVisible = true;
                },
                openRefundHandleDialog(row) {
                    this.refundHandleForm = { id: row.id, approve: true, reply: '' };
                    this.refundHandleVisible = true;
                },
                submitRefundHandle() {
                    this.submittingRefund = true;
                    axios.post('/api/mall/refund/admin/approve', {
                        id: this.refundHandleForm.id,
                        approve: this.refundHandleForm.approve,
                        reply: this.refundHandleForm.reply
                    })
                        .then(response => {
                            if (response.data.code === 200) {
                                this.$message.success(response.data.message);
                                this.refundHandleVisible = false;
                                this.loadRefundData();
                            } else { this.$message.error(response.data.message); }
                        })
                        .catch(() => { this.$message.error('审核失败'); })
                        .finally(() => { this.submittingRefund = false; });
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能选品</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #0f766e 0%, #0369a1 55%, #4f46e5 100%);
            border-radius: 16px;
            padding: 32px 36px;
            color: #fff;
            margin-bottom: 24px;
        }
        .hero-section h2 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
        .hero-section .subtitle { font-size: 14px; opacity: .8; margin-bottom: 16px; }
        .hero-section .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .hero-section .el-tag { background: rgba(255,255,255,.2); color: #fff; border: none; }

        .empty-state { padding: 40px 0; text-align: center; color: #94a3b8; }
        .empty-state .el-icon { font-size: 48px; margin-bottom: 12px; display: block; }

        .summary-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .summary-row .summary-card { flex: 1; min-width: 140px; background: #f8fafc; border-radius: 10px; padding: 14px 18px; border: 1px solid #e2e8f0; }
        .summary-row .summary-card .num { font-size: 26px; font-weight: 700; }
        .summary-row .summary-card .lbl { font-size: 12px; color: #64748b; margin-top: 2px; }

        .action-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .action-bar .info-text { font-size: 13px; color: #64748b; }
        .page-wrap { min-height: calc(100vh - 140px); }
        .tab-content { padding-top: 4px; }
    </style>
</head>
<body>
<div id="app">
    <admin-layout :active-menu="'community-smart-selection'">
        <template #content>
            <div class="page-wrap" v-loading="pageLoading">

                <!-- Hero -->
                <div class="hero-section">
                    <h2>智能选品中心</h2>
                    <div class="subtitle">数据驱动的采购决策助手，帮助你发现好商品、优化库存结构</div>
                    <div class="toolbar">
                        <el-button size="small" @click="loadAll" style="background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.5)">↻ 刷新数据</el-button>
                        <el-tag size="small" v-if="lastUpdated">更新于 {{ lastUpdated }}</el-tag>
                    </div>
                </div>

                <!-- 数据概览 -->
                <div class="summary-row">
                    <div class="summary-card"><div class="num" style="color:#2563eb">{{ dashboard.newProductCount || 0 }}</div><div class="lbl">推荐商品</div></div>
                    <div class="summary-card"><div class="num" style="color:#dc2626">{{ dashboard.slowHighCount || 0 }}<small style="font-size:14px;color:#94a3b8">/{{ dashboard.slowMovingCount || 0 }}</small></div><div class="lbl">滞销商品 <small style="color:#94a3b8">高危/总计</small></div></div>
                    <div class="summary-card"><div class="num" style="color:#d97706">{{ dashboard.urgentRestockCount || 0 }}</div><div class="lbl">待补货</div></div>
                    <div class="summary-card"><div class="num" style="color:#059669">{{ dashboard.seasonalCount || 0 }}</div><div class="lbl">应季推荐</div></div>
                    <div class="summary-card"><div class="num" style="color:#6366f1">{{ dashboard.inventoryHealth ? dashboard.inventoryHealth.healthy : '-' }}</div><div class="lbl">库存健康</div></div>
                </div>

                <!-- Tabs -->
                <el-tabs v-model="activeTab" @tab-click="onTabChange" style="background:#fff;border-radius:12px;padding:0 4px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
                        <el-tab-pane label="商品推荐" name="newProducts">
                            <div class="tab-content">
                                <div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
                                    <span style="font-size:13px;color:#64748b">
                                        以下商品按推荐分从高到低排序，有预测数据的已自动预选
                                    </span>
                                    <el-button type="primary" size="small"
                                        :loading="purchasing"
                                        @click="batchPurchase">
                                        一键采购 ({{ selectedProductIds.length }})
                                    </el-button>
                                </div>
                                <el-table ref="newProductsTable" :data="newProducts" stripe size="small" v-loading="loading.newProducts" @selection-change="onNewProductSelectionChange">
                                    <el-table-column type="selection" width="50"></el-table-column>
                                    <el-table-column label="推荐分" width="90" align="center" sortable prop="recommendationScore">
                                        <template slot-scope="s">
                                            <el-tooltip placement="top" width="200" effect="dark">
                                                <div slot="content">
                                                    <div style="font-size:12px;line-height:1.8">
                                                        <div>预测销量: {{ s.row.scoreDetails.forecastScore || 0 }}分</div>
                                                        <div>历史销量: {{ s.row.scoreDetails.salesScore || 0 }}分</div>
                                                        <div>库存健康: {{ s.row.scoreDetails.stockScore || 0 }}分</div>
                                                        <div>价格系数: {{ s.row.scoreDetails.priceScore || 0 }}分</div>
                                                        <div>热度加分: {{ s.row.scoreDetails.hotScore || 0 }}分</div>
                                                        <div style="border-top:1px solid rgba(255,255,255,.2);margin-top:4px;padding-top:4px;font-weight:600">总分: {{ s.row.recommendationScore }}分</div>
                                                    </div>
                                                </div>
                                                <el-progress :percentage="s.row.recommendationScore" :width="32" type="circle" :stroke-width="6"
                                                    :color="s.row.recommendationScore >= 70 ? '#67c23a' : s.row.recommendationScore >= 40 ? '#e6a23c' : '#f56c6c'"
                                                    :show-text="false">
                                                </el-progress>
                                                <span style="margin-left:4px;font-size:12px;font-weight:600;color:#475569">{{ s.row.recommendationScore }}</span>
                                            </el-tooltip>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="productName" label="商品名称" min-width="180">
                                        <template slot-scope="s">
                                            <div style="display:flex;align-items:center;gap:10px">
                                                <img :src="s.row.mainImage" style="width:40px;height:40px;border-radius:6px;object-fit:cover;background:#f1f5f9" @error="onImgError">
                                                <span>{{ s.row.productName }}</span>
                                            </div>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="sales" label="总销量" width="80" align="right"></el-table-column>
                                    <el-table-column prop="forecastQuantity" label="预测销量" width="80" align="right">
                                        <template slot-scope="s">
                                            <span v-if="s.row.forecastQuantity > 0" style="color:#059669;font-weight:600">{{ s.row.forecastQuantity }}</span>
                                            <span v-else style="color:#94a3b8">-</span>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="stock" label="库存" width="70" align="right"></el-table-column>
                                    <el-table-column label="推荐购入" width="110" align="center">
                                        <template slot-scope="s">
                                            <el-input-number v-model="s.row.purchaseQuantity"
                                                :min="1" :max="9999" size="mini"
                                                :disabled="!isSelected(s.row.productId)"
                                                controls-position="right" style="width:88px">
                                            </el-input-number>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="price" label="价格" width="80" align="right">
                                        <template slot-scope="s">¥{{ s.row.price }}</template>
                                    </el-table-column>
                                    <el-table-column prop="categoryName" label="品类" width="80"></el-table-column>
                                </el-table>
                                <div v-if="newProducts.length === 0 && !loading.newProducts" class="empty-state">
                                    <i class="el-icon-goods"></i>
                                    <p>暂无商品推荐</p>
                                </div>
                            </div>
                        </el-tab-pane>

                        <el-tab-pane label="滞销预警" name="slowMoving">
                            <div class="tab-content">
                                <el-table :data="slowMoving" stripe size="small" v-loading="loading.slowMoving">
                                    <el-table-column prop="productName" label="商品名称" min-width="200">
                                        <template slot-scope="s">
                                            <div style="display:flex;align-items:center;gap:10px">
                                                <img :src="s.row.mainImage" style="width:40px;height:40px;border-radius:6px;object-fit:cover;background:#f1f5f9" @error="onImgError">
                                                <span>{{ s.row.productName }}</span>
                                            </div>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="categoryName" label="品类" width="100"></el-table-column>
                                    <el-table-column prop="stock" label="库存" width="80" align="right"></el-table-column>
                                    <el-table-column prop="dailyAvgSales" label="日均销量" width="90" align="right"></el-table-column>
                                    <el-table-column prop="turnoverDays" label="周转天数" width="100" align="right">
                                        <template slot-scope="s">{{ s.row.turnoverDays !== null ? s.row.turnoverDays : '∞' }}</template>
                                    </el-table-column>
                                    <el-table-column prop="slowDays" label="滞销天数" width="100" align="right">
                                        <template slot-scope="s">{{ s.row.slowDays !== null ? s.row.slowDays : '∞' }}</template>
                                    </el-table-column>
                                    <el-table-column label="风险等级" width="100" align="center">
                                        <template slot-scope="s">
                                            <el-tag :type="s.row.tagType" size="mini" effect="dark">
                                                {{ s.row.riskLevel === 'high' ? '高风险' : s.row.riskLevel === 'medium' ? '中风险' : s.row.riskLevel === 'low' ? '低风险' : '正常' }}
                                            </el-tag>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="suggestion" label="处理建议" min-width="160"></el-table-column>
                                    <el-table-column label="折扣操作" width="160" align="center">
                                        <template slot-scope="s">
                                            <el-popover v-if="s.row.riskLevel === 'high' || s.row.riskLevel === 'medium'"
                                                placement="left" width="200" trigger="click">
                                                <div style="text-align:center">
                                                    <p style="margin-bottom:12px;font-size:13px">设置折扣率</p>
                                                    <el-slider v-model="s.row._discountValue"
                                                        :min="50" :max="100" :step="5"
                                                        show-input style="padding:0 8px"
                                                        input-size="mini">
                                                    </el-slider>
                                                    <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
                                                        <el-button size="mini" type="primary"
                                                            :loading="s.row._discountLoading"
                                                            @click="applyDiscount(s.row)">应用</el-button>
                                                        <el-button size="mini"
                                                            v-if="s.row.discountRate"
                                                            @click="clearDiscount(s.row)">清除</el-button>
                                                    </div>
                                                </div>
                                                <el-button slot="reference" size="mini"
                                                    :type="s.row.discountRate ? 'warning' : 'default'"
                                                    icon="el-icon-s-marketing" plain>
                                                    {{ s.row.discountRate ? '已打' + (s.row.discountRate * 100).toFixed(0) + '折' : '打折' }}
                                                </el-button>
                                            </el-popover>
                                            <span v-else style="color:#94a3b8;font-size:12px">-</span>
                                        </template>
                                    </el-table-column>
                                </el-table>
                                <div v-if="slowMoving.length === 0 && !loading.slowMoving" class="empty-state">
                                    <i class="el-icon-circle-check"></i>
                                    <p>暂无滞销商品，库存状况良好</p>
                                </div>
                            </div>
                        </el-tab-pane>

                        <el-tab-pane label="补货优先级" name="restockPriority">
                            <div class="tab-content">
                                <el-table :data="restockPriority" stripe size="small" v-loading="loading.restockPriority">
                                    <el-table-column prop="productName" label="商品名称" min-width="180">
                                        <template slot-scope="s">
                                            <div style="display:flex;align-items:center;gap:10px">
                                                <img :src="s.row.mainImage" style="width:36px;height:36px;border-radius:6px;object-fit:cover;background:#f1f5f9" @error="onImgError">
                                                <span>{{ s.row.productName }}</span>
                                            </div>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="stock" label="库存" width="70" align="right"></el-table-column>
                                    <el-table-column prop="sellableDays" label="可售天数" width="90" align="right">
                                        <template slot-scope="s">{{ s.row.sellableDays !== null ? s.row.sellableDays : '∞' }}</template>
                                    </el-table-column>
                                    <el-table-column prop="dailyAvgSales" label="日均销量" width="90" align="right"></el-table-column>
                                    <el-table-column prop="weekSales" label="近7天销量" width="100" align="right"></el-table-column>
                                    <el-table-column label="建议补货" width="100" align="right">
                                        <template slot-scope="s">
                                            <span style="color:#059669;font-weight:600">{{ s.row.suggestedRestock }}</span>
                                        </template>
                                    </el-table-column>
                                    <el-table-column label="优先级" width="110" align="center">
                                        <template slot-scope="s">
                                            <el-tag :type="s.row.priorityLevel === 1 ? 'danger' : s.row.priorityLevel === 2 ? 'warning' : s.row.priorityLevel === 3 ? 'info' : 'success'" size="mini" effect="dark">
                                                {{ s.row.priorityLabel }}
                                            </el-tag>
                                        </template>
                                    </el-table-column>
                                </el-table>
                                <div v-if="restockPriority.length === 0 && !loading.restockPriority" class="empty-state">
                                    <i class="el-icon-sold-out"></i>
                                    <p>暂无需要补货的商品</p>
                                </div>
                            </div>
                        </el-tab-pane>

                        <el-tab-pane label="季节选品" name="seasonal">
                            <div class="tab-content">
                                <el-table :data="seasonal" stripe size="small" v-loading="loading.seasonal">
                                    <el-table-column prop="productName" label="商品名称" min-width="200">
                                        <template slot-scope="s">
                                            <div style="display:flex;align-items:center;gap:10px">
                                                <img :src="s.row.mainImage" style="width:40px;height:40px;border-radius:6px;object-fit:cover;background:#f1f5f9" @error="onImgError">
                                                <span>{{ s.row.productName }}</span>
                                            </div>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="categoryName" label="品类" width="100"></el-table-column>
                                    <el-table-column prop="seasonSales" label="历史月销量" width="110" align="right"></el-table-column>
                                    <el-table-column prop="seasonOrders" label="历史月订单数" width="120" align="right"></el-table-column>
                                    <el-table-column prop="price" label="价格" width="90" align="right">
                                        <template slot-scope="s">¥{{ s.row.price }}</template>
                                    </el-table-column>
                                    <el-table-column label="标签" width="110" align="center">
                                        <template slot-scope="s">
                                            <el-tag type="success" size="mini" effect="plain">{{ s.row.seasonLabel }}</el-tag>
                                        </template>
                                    </el-table-column>
                                </el-table>
                                <div v-if="seasonal.length === 0 && !loading.seasonal" class="empty-state">
                                    <i class="el-icon-date"></i>
                                    <p>暂无季节选品推荐</p>
                                </div>
                            </div>
                        </el-tab-pane>
                    </el-tabs>

            </div>
        </template>
    </admin-layout>
</div>

<script src="/static/js/vue.js"></script>
<script src="/static/js/element-ui.min.js"></script>
<script src="/static/js/axios.min.js"></script>
<script src="/static/js/config/layout-config.js"></script>
<script src="/static/js/components/layout.js"></script>
<script>
new Vue({
    el: '#app',
    data: {
        pageLoading: false,
        lastUpdated: null,
        activeTab: 'newProducts',
        dashboard: {},
        newProducts: [],
        slowMoving: [],
        restockPriority: [],
        seasonal: [],
        loading: {
            newProducts: false,
            slowMoving: false,
            restockPriority: false,
            seasonal: false,
        },
        selectedProductIds: [],
        purchasing: false,
    },
    mounted: function () {
        this.loadAll();
    },
    methods: {
        onImgError: function (e) {
            e.target.src = '/static/picture/noimg.jpg';
        },
        loadAll: function () {
            var self = this;
            self.pageLoading = true;
            self.loadDashboard();
            // load active tab
            self.loadTab(self.activeTab);
            var now = new Date();
            self.lastUpdated = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0');
            // preload other tabs in background
            setTimeout(function () { self.loadTab('slowMoving', true); }, 300);
            setTimeout(function () { self.loadTab('restockPriority', true); }, 600);
            setTimeout(function () { self.loadTab('seasonal', true); }, 900);
        },
        loadDashboard: function () {
            var self = this;
            axios.get('/api/smart-selection/dashboard')
                .then(function (res) {
                    if (res.data.code === 200) {
                        self.dashboard = res.data.data;
                    }
                })
                .catch(function () {
                    self.$message.error('加载看板数据失败');
                })
                .finally(function () {
                    self.pageLoading = false;
                });
        },
        loadTab: function (tabName, silent) {
            var self = this;
            var apiMap = {
                newProducts: '/api/smart-selection/new-products',
                slowMoving: '/api/smart-selection/slow-moving',
                restockPriority: '/api/smart-selection/restock-priority',
                seasonal: '/api/smart-selection/seasonal',
            };
            var dataKey = {
                newProducts: 'newProducts',
                slowMoving: 'slowMoving',
                restockPriority: 'restockPriority',
                seasonal: 'seasonal',
            };
            var url = apiMap[tabName];
            if (!url) return;
            if (!silent) self.loading[tabName] = true;
            axios.get(url)
                .then(function (res) {
                    if (res.data.code === 200) {
                        var items = res.data.data.products || [];
                        if (tabName === 'newProducts') {
                            items.forEach(function (item) {
                                item.purchaseQuantity = item.recommendedQuantity || 10;
                            });
                        }
                        if (tabName === 'slowMoving') {
                            items.forEach(function (item) {
                                item._discountValue = (item.discountRate ? item.discountRate * 100 : 80);
                                item._discountLoading = false;
                            });
                        }
                        self[dataKey[tabName]] = items;
                        if (tabName === 'newProducts') {
                            self.selectedProductIds = [];
                            self.$nextTick(function () {
                                self.preselectNewProducts(items);
                            });
                        }
                    }
                })
                .catch(function () {
                    if (!silent) self.$message.error('加载数据失败');
                })
                .finally(function () {
                    if (!silent) self.loading[tabName] = false;
                });
        },
        applyDiscount: function (row) {
            var self = this;
            var rate = (row._discountValue || 50) / 100;
            row._discountLoading = true;
            axios.post('/api/smart-selection/slow-moving/discount', {
                productId: row.productId,
                discountRate: rate,
            }).then(function (res) {
                if (res.data.code === 200) {
                    self.$message.success('已设置 ' + (rate * 100).toFixed(0) + '% 折扣');
                    self.loadTab('slowMoving', true);
                } else {
                    self.$message.error(res.data.message);
                }
            }).catch(function () {
                self.$message.error('设置折扣失败');
            }).finally(function () {
                row._discountLoading = false;
            });
        },
        clearDiscount: function (row) {
            var self = this;
            axios.delete('/api/smart-selection/slow-moving/discount', {
                params: { productId: row.productId }
            }).then(function (res) {
                if (res.data.code === 200) {
                    self.$message.success('折扣已清除');
                    self.loadTab('slowMoving', true);
                } else {
                    self.$message.error(res.data.message);
                }
            }).catch(function () {
                self.$message.error('清除折扣失败');
            });
        },
        onTabChange: function (tab) {
            var name = tab.name || tab;
            var hasData = {
                newProducts: this.newProducts.length,
                slowMoving: this.slowMoving.length,
                restockPriority: this.restockPriority.length,
                seasonal: this.seasonal.length,
            };
            if (!hasData[name]) {
                this.loadTab(name);
            }
        },
        onNewProductSelectionChange: function (rows) {
            this.selectedProductIds = rows.map(function (r) { return r.productId; });
        },
        isSelected: function (productId) {
            return this.selectedProductIds.indexOf(productId) !== -1;
        },
        preselectNewProducts: function (items) {
            var self = this;
            if (!self.$refs.newProductsTable) return;
            var selected = [];
            items.forEach(function (item) {
                if (item.recommendationScore >= 60) {
                    self.$refs.newProductsTable.toggleRowSelection(item, true);
                    selected.push(item.productId);
                }
            });
            self.$nextTick(function () {
                self.selectedProductIds = selected;
            });
        },
        batchPurchase: function () {
            var self = this;
            if (self.selectedProductIds.length === 0) {
                self.$message.warning('请至少选择一个商品');
                return;
            }
            // 收集选中商品及其购入数量
            var products = self.newProducts
                .filter(function (item) { return self.selectedProductIds.indexOf(item.productId) !== -1; })
                .map(function (item) { return { productId: item.productId, quantity: item.purchaseQuantity || 10 }; });
            self.$confirm('确认采购选中的 ' + products.length + ' 个商品？系统将自动生成采购订单，请在采购订单管理中确认并支付。', '确认采购', {
                confirmButtonText: '确认',
                cancelButtonText: '取消',
                type: 'info',
            }).then(function () {
                self.purchasing = true;
                axios.post('/api/smart-selection/batch-purchase', {
                    products: products,
                }).then(function (res) {
                    if (res.data.code === 200) {
                        var purchasedIds = self.selectedProductIds.slice();
                        self.$confirm(res.data.message + '，是否前往采购订单管理？', '采购成功', {
                            confirmButtonText: '去查看订单',
                            cancelButtonText: '继续选品',
                            type: 'success',
                        }).then(function () {
                            window.location.href = '/admin/supplier/purchase-orders.html';
                        }).catch(function () {
                            self.newProducts = self.newProducts.filter(function (item) {
                                return purchasedIds.indexOf(item.productId) === -1;
                            });
                            self.selectedProductIds = [];
                            self.loadDashboard();
                        });
                    } else {
                        self.$message.error(res.data.message || '采购失败');
                    }
                }).catch(function () {
                    self.$message.error('采购请求失败');
                }).finally(function () {
                    self.purchasing = false;
                });
            }).catch(function () {});
        },
    },
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区团长管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .supplier-management-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pagination-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .dialog-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .license-uploader .el-upload {
            border: 1px dashed #d9d9d9;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .license-uploader .el-upload:hover {
            border-color: #409eff;
        }

        .license-uploader-icon {
            font-size: 28px;
            color: #8c939d;
            width: 160px;
            height: 160px;
            line-height: 160px;
            text-align: center;
        }

        .license-image {
            width: 160px;
            height: 160px;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div id="app">
        <admin-layout :active-menu="activeMenu">
            <template #content>
                <div class="supplier-management-container">
                    <el-card class="search-card">
                        <el-form :model="searchForm" :inline="true" class="search-form">
                            <el-form-item label="关键词">
                                <el-input
                                    v-model="searchForm.keyword"
                                    placeholder="社区名称 / 社区编码"
                                    clearable>
                                </el-input>
                            </el-form-item>
                            <el-form-item label="审核状态">
                                <el-select
                                    v-model="searchForm.status"
                                    placeholder="选择状态"
                                    clearable>
                                    <el-option label="待审核" value="pending"></el-option>
                                    <el-option label="已通过" value="approved"></el-option>
                                    <el-option label="已拒绝" value="rejected"></el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="primary" @click="searchLeaders">搜索</el-button>
                                <el-button @click="resetSearch">重置</el-button>
                            </el-form-item>
                        </el-form>
                    </el-card>

                    <el-card class="table-card">
                        <div slot="header" class="card-header">
                            <span>社区团长列表</span>
                            <el-button type="primary" icon="el-icon-plus" @click="showAddDialog">新增团长</el-button>
                        </div>

                        <el-table :data="tableData" v-loading="loading" stripe style="width: 100%">
                            <el-table-column prop="id" label="ID" width="80"></el-table-column>
                            <el-table-column prop="username" label="账号" width="120"></el-table-column>
                            <el-table-column prop="supplierName" label="社区名称" min-width="160"></el-table-column>
                            <el-table-column prop="supplierCode" label="社区编码" width="120"></el-table-column>
                            <el-table-column prop="supplierContact" label="团长姓名" width="120"></el-table-column>
                            <el-table-column prop="supplierContactPhone" label="联系电话" width="140"></el-table-column>
                            <el-table-column prop="email" label="邮箱" min-width="180"></el-table-column>
                            <el-table-column label="审核状态" width="100">
                                <template #default="scope">
                                    <el-tag :type="getSupplierStatusType(scope.row.supplierStatus)" size="small">
                                        {{ getSupplierStatusText(scope.row.supplierStatus) }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column label="账号状态" width="100">
                                <template #default="scope">
                                    <el-tag :type="scope.row.status === 'active' ? 'success' : 'danger'" size="small">
                                        {{ scope.row.status === 'active' ? '正常' : '锁定' }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column label="操作" width="320" fixed="right">
                                <template #default="scope">
                                    <el-button type="text" size="small" @click="editLeader(scope.row)">编辑</el-button>
                                    <el-button
                                        v-if="scope.row.supplierStatus === 'pending'"
                                        type="text"
                                        size="small"
                                        @click="approveLeader(scope.row)">
                                        通过
                                    </el-button>
                                    <el-button
                                        v-if="scope.row.supplierStatus === 'pending'"
                                        type="text"
                                        size="small"
                                        @click="rejectLeader(scope.row)">
                                        拒绝
                                    </el-button>
                                    <el-button type="text" size="small" @click="toggleStatus(scope.row)">
                                        {{ scope.row.status === 'active' ? '锁定' : '启用' }}
                                    </el-button>
                                    <el-button type="text" size="small" style="color:#f56c6c" @click="deleteLeader(scope.row)">
                                        删除
                                    </el-button>
                                </template>
                            </el-table-column>
                        </el-table>

                        <div class="pagination-container">
                            <el-pagination
                                @size-change="handleSizeChange"
                                @current-change="handleCurrentChange"
                                :current-page="pagination.pageNum"
                                :page-sizes="[10, 20, 50, 100]"
                                :page-size="pagination.pageSize"
                                layout="total, sizes, prev, pager, next, jumper"
                                :total="pagination.total">
                            </el-pagination>
                        </div>
                    </el-card>

                    <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="48%" @close="resetForm">
                        <el-form :model="form" :rules="rules" ref="leaderForm" label-width="120px">
                            <el-row :gutter="20">
                                <el-col :span="12">
                                    <el-form-item label="账号" prop="username">
                                        <el-input v-model="form.username" :disabled="isEdit"></el-input>
                                    </el-form-item>
                                </el-col>
                                <el-col :span="12" v-if="!isEdit">
                                    <el-form-item label="密码" prop="password">
                                        <el-input v-model="form.password" type="password"></el-input>
                                    </el-form-item>
                                </el-col>
                            </el-row>

                            <el-row :gutter="20">
                                <el-col :span="12">
                                    <el-form-item label="社区名称" prop="supplierName">
                                        <el-input v-model="form.supplierName"></el-input>
                                    </el-form-item>
                                </el-col>
                                <el-col :span="12">
                                    <el-form-item label="社区编码" prop="supplierCode">
                                        <el-input v-model="form.supplierCode"></el-input>
                                    </el-form-item>
                                </el-col>
                            </el-row>

                            <el-row :gutter="20">
                                <el-col :span="12">
                                    <el-form-item label="团长姓名" prop="supplierContact">
                                        <el-input v-model="form.supplierContact"></el-input>
                                    </el-form-item>
                                </el-col>
                                <el-col :span="12">
                                    <el-form-item label="联系电话" prop="supplierContactPhone">
                                        <el-input v-model="form.supplierContactPhone"></el-input>
                                    </el-form-item>
                                </el-col>
                            </el-row>

                            <el-row :gutter="20">
                                <el-col :span="12">
                                    <el-form-item label="邮箱" prop="email">
                                        <el-input v-model="form.email"></el-input>
                                    </el-form-item>
                                </el-col>
                                <el-col :span="12">
                                    <el-form-item label="手机号" prop="phone">
                                        <el-input v-model="form.phone"></el-input>
                                    </el-form-item>
                                </el-col>
                            </el-row>

                            <el-row :gutter="20">
                                <el-col :span="12">
                                    <el-form-item label="昵称" prop="nickname">
                                        <el-input v-model="form.nickname"></el-input>
                                    </el-form-item>
                                </el-col>
                                <el-col :span="12">
                                    <el-form-item label="审核状态" prop="supplierStatus">
                                        <el-select v-model="form.supplierStatus" style="width: 100%">
                                            <el-option label="待审核" value="pending"></el-option>
                                            <el-option label="已通过" value="approved"></el-option>
                                            <el-option label="已拒绝" value="rejected"></el-option>
                                        </el-select>
                                    </el-form-item>
                                </el-col>
                            </el-row>

                            <el-row :gutter="20">
                                <el-col :span="12">
                                    <el-form-item label="账号状态" prop="status">
                                        <el-select v-model="form.status" style="width: 100%">
                                            <el-option label="正常" value="active"></el-option>
                                            <el-option label="锁定" value="locked"></el-option>
                                        </el-select>
                                    </el-form-item>
                                </el-col>
                            </el-row>

                            <el-form-item label="资质图片">
                                <el-upload
                                    class="license-uploader"
                                    action="/open/upload"
                                    :show-file-list="false"
                                    :on-success="handleUploadSuccess"
                                    :before-upload="beforeUpload">
                                    <img v-if="form.supplierLicense" :src="form.supplierLicense" class="license-image" alt="资质图片">
                                    <i v-else class="el-icon-plus license-uploader-icon"></i>
                                </el-upload>
                            </el-form-item>
                        </el-form>

                        <div class="dialog-footer">
                            <el-button @click="dialogVisible = false">取消</el-button>
                            <el-button type="primary" :loading="saveLoading" @click="saveLeader">确定</el-button>
                        </div>
                    </el-dialog>
                </div>
            </template>
        </admin-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    activeMenu: 'community-leader-manage',
                    searchForm: {
                        keyword: '',
                        status: ''
                    },
                    tableData: [],
                    loading: false,
                    pagination: {
                        pageNum: 1,
                        pageSize: 10,
                        total: 0
                    },
                    dialogVisible: false,
                    dialogTitle: '新增团长',
                    isEdit: false,
                    saveLoading: false,
                    form: {
                        id: null,
                        username: '',
                        password: '',
                        supplierName: '',
                        supplierCode: '',
                        supplierContact: '',
                        supplierContactPhone: '',
                        email: '',
                        nickname: '',
                        phone: '',
                        supplierLicense: '',
                        supplierStatus: 'pending',
                        status: 'active',
                        role: 'community_leader'
                    },
                    rules: {
                        username: [
                            { required: true, message: '请输入账号', trigger: 'blur' },
                            { min: 3, max: 20, message: '账号长度应为 3-20 位', trigger: 'blur' }
                        ],
                        password: [
                            { required: true, message: '请输入密码', trigger: 'blur' },
                            { min: 6, message: '密码长度不能少于 6 位', trigger: 'blur' }
                        ],
                        supplierName: [
                            { required: true, message: '请输入社区名称', trigger: 'blur' }
                        ],
                        supplierCode: [
                            { required: true, message: '请输入社区编码', trigger: 'blur' }
                        ],
                        supplierContact: [
                            { required: true, message: '请输入团长姓名', trigger: 'blur' }
                        ],
                        supplierContactPhone: [
                            { required: true, message: '请输入联系电话', trigger: 'blur' },
                            { pattern: /^1[3-9]\\d{9}$/, message: '请输入正确的手机号', trigger: 'blur' }
                        ],
                        email: [
                            { type: 'email', message: '请输入正确的邮箱地址', trigger: 'blur' }
                        ]
                    }
                };
            },
            mounted() {
                this.loadData();
            },
            methods: {
                loadData() {
                    this.loading = true;
                    axios.get('/api/admin/suppliers', {
                        params: {
                            pageNum: this.pagination.pageNum,
                            pageSize: this.pagination.pageSize,
                            keyword: this.searchForm.keyword,
                            supplierStatus: this.searchForm.status
                        }
                    }).then(response => {
                        if (response.data.code === 200) {
                            this.tableData = response.data.data.rows || [];
                            this.pagination.total = response.data.data.total || 0;
                        } else {
                            this.$message.error(response.data.message);
                        }
                    }).catch(error => {
                        console.error(error);
                        this.$message.error('加载失败');
                    }).finally(() => {
                        this.loading = false;
                    });
                },
                searchLeaders() {
                    this.pagination.pageNum = 1;
                    this.loadData();
                },
                resetSearch() {
                    this.searchForm = { keyword: '', status: '' };
                    this.pagination.pageNum = 1;
                    this.loadData();
                },
                handleSizeChange(size) {
                    this.pagination.pageSize = size;
                    this.pagination.pageNum = 1;
                    this.loadData();
                },
                handleCurrentChange(page) {
                    this.pagination.pageNum = page;
                    this.loadData();
                },
                showAddDialog() {
                    this.resetForm();
                    this.dialogTitle = '新增团长';
                    this.isEdit = false;
                    this.dialogVisible = true;
                },
                editLeader(row) {
                    this.resetForm();
                    this.dialogTitle = '编辑团长';
                    this.isEdit = true;
                    this.form = Object.assign({}, this.form, row, {
                        role: 'community_leader',
                        password: ''
                    });
                    this.dialogVisible = true;
                },
                saveLeader() {
                    this.$refs.leaderForm.validate(valid => {
                        if (!valid) {
                            return;
                        }
                        this.saveLoading = true;
                        const url = this.isEdit ? `/api/admin/suppliers/${this.form.id}` : '/api/admin/suppliers';
                        const method = this.isEdit ? 'put' : 'post';
                        axios[method](url, this.form).then(response => {
                            if (response.data.code === 200) {
                                this.$message.success(response.data.message);
                                this.dialogVisible = false;
                                this.loadData();
                            } else {
                                this.$message.error(response.data.message);
                            }
                        }).catch(error => {
                            console.error(error);
                            this.$message.error('保存失败');
                        }).finally(() => {
                            this.saveLoading = false;
                        });
                    });
                },
                approveLeader(row) {
                    axios.put(`/api/admin/suppliers/${row.id}/approve`).then(response => {
                        if (response.data.code === 200) {
                            this.$message.success(response.data.message);
                            this.loadData();
                        } else {
                            this.$message.error(response.data.message);
                        }
                    });
                },
                rejectLeader(row) {
                    axios.put(`/api/admin/suppliers/${row.id}/reject`).then(response => {
                        if (response.data.code === 200) {
                            this.$message.success(response.data.message);
                            this.loadData();
                        } else {
                            this.$message.error(response.data.message);
                        }
                    });
                },
                toggleStatus(row) {
                    const newStatus = row.status === 'active' ? 'locked' : 'active';
                    axios.put(`/api/admin/suppliers/${row.id}/status`, {
                        status: newStatus
                    }).then(response => {
                        if (response.data.code === 200) {
                            this.$message.success(response.data.message);
                            this.loadData();
                        } else {
                            this.$message.error(response.data.message);
                        }
                    });
                },
                deleteLeader(row) {
                    axios.delete(`/api/admin/suppliers/${row.id}`).then(response => {
                        if (response.data.code === 200) {
                            this.$message.success(response.data.message);
                            this.loadData();
                        } else {
                            this.$message.error(response.data.message);
                        }
                    });
                },
                resetForm() {
                    this.form = {
                        id: null,
                        username: '',
                        password: '',
                        supplierName: '',
                        supplierCode: '',
                        supplierContact: '',
                        supplierContactPhone: '',
                        email: '',
                        nickname: '',
                        phone: '',
                        supplierLicense: '',
                        supplierStatus: 'pending',
                        status: 'active',
                        role: 'community_leader'
                    };
                    this.$nextTick(() => {
                        if (this.$refs.leaderForm) {
                            this.$refs.leaderForm.clearValidate();
                        }
                    });
                },
                handleUploadSuccess(response) {
                    if (response.code === 200) {
                        this.form.supplierLicense = response.data.url;
                        this.$message.success('上传成功');
                    } else {
                        this.$message.error('上传失败');
                    }
                },
                beforeUpload(file) {
                    const isImage = file.type.indexOf('image/') === 0;
                    const isLt2M = file.size / 1024 / 1024 < 2;
                    if (!isImage) {
                        this.$message.error('只能上传图片文件');
                    }
                    if (!isLt2M) {
                        this.$message.error('图片大小不能超过 2MB');
                    }
                    return isImage && isLt2M;
                },
                getSupplierStatusText(status) {
                    const statusMap = {
                        pending: '待审核',
                        approved: '已通过',
                        rejected: '已拒绝'
                    };
                    return statusMap[status] || status;
                },
                getSupplierStatusType(status) {
                    const typeMap = {
                        pending: 'warning',
                        approved: 'success',
                        rejected: 'danger'
                    };
                    return typeMap[status] || 'info';
                }
            }
        });
    </script>
</body>
</html>

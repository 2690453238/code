<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 管理系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-primary: #e8a81a;
            --red-deep:    #96281b;
            --red-light:   #e74c3c;
            --red-soft:    #fdf1f0;
            --red-border:  #f5c6c2;
            --gold:        #c9a84c;
            --text-dark:   #1a0a08;
            --text-muted:  #7a5c58;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
            background: url('/static/image/bg.jpg') center center no-repeat;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 30px 0;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg,
                rgba(96, 20, 12, 0.72) 0%,
                rgba(160, 40, 24, 0.55) 50%,
                rgba(20, 6, 4, 0.78) 100%);
            z-index: 0;
        }

        .register-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            width: 900px;
            min-height: 580px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(96, 20, 12, 0.55),
                        0 2px 0 rgba(201,168,76,0.35) inset;
        }

        /* ── 左侧品牌区 ── */
        .register-brand {
            flex: 0 0 300px;
            background: linear-gradient(160deg, var(--red-primary) 0%, var(--red-deep) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 30px;
            position: relative;
            overflow: hidden;
        }

        .register-brand::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 220px; height: 220px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
        }
        .register-brand::after {
            content: '';
            position: absolute;
            bottom: -80px; left: -50px;
            width: 260px; height: 260px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }

        .brand-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(201,168,76,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 24px;
            box-shadow: 0 0 0 8px rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }

        .brand-title {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 0 0 12px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .brand-sub {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .brand-divider {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 20px auto;
            position: relative;
            z-index: 1;
        }

        .brand-steps {
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
            margin-top: 10px;
            width: 100%;
        }

        .brand-step {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255,255,255,0.85);
            font-size: 13px;
        }

        .brand-step-num {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid rgba(201,168,76,0.7);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        /* ── 右侧表单区 ── */
        .register-form-area {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 44px 48px;
        }

        .form-header {
            margin-bottom: 28px;
        }

        .form-header h3 {
            margin: 0 0 6px;
            font-size: 22px;
            color: var(--text-dark);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .form-header p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-header-line {
            width: 36px;
            height: 3px;
            background: var(--red-primary);
            border-radius: 2px;
            margin-top: 12px;
        }

        /* 两列布局 */
        .form-row {
            display: flex;
            gap: 16px;
        }
        .form-row .el-form-item {
            flex: 1;
        }

        /* Element UI 覆盖 */
        .register-form-area .el-input__inner {
            border-color: #e8d5d3;
            border-radius: 8px;
            height: 42px;
            font-size: 14px;
            color: var(--text-dark);
            transition: border-color .25s, box-shadow .25s;
        }
        .register-form-area .el-input__inner:focus {
            border-color: var(--red-primary);
            box-shadow: 0 0 0 3px rgba(192,57,43,0.12);
        }
        .register-form-area .el-input__prefix {
            color: var(--red-primary);
        }
        .register-form-area .el-form-item {
            margin-bottom: 16px;
        }
        .register-form-area .el-form-item__error {
            color: var(--red-light);
        }

        .register-btn {
            width: 100%;
            height: 46px;
            font-size: 15px;
            letter-spacing: 3px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--red-light) 0%, var(--red-primary) 60%, var(--red-deep) 100%);
            border: none;
            color: #fff;
            cursor: pointer;
            margin-top: 4px;
            font-family: inherit;
            transition: opacity .2s, transform .15s, box-shadow .2s;
            box-shadow: 0 4px 18px rgba(192,57,43,0.38);
        }
        .register-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(192,57,43,0.45);
        }
        .register-btn:active {
            transform: translateY(0);
        }
        .register-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            text-align: center;
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .form-footer a {
            color: var(--red-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .form-footer a:hover {
            color: var(--red-deep);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <!-- 左侧品牌 --> 

        <!-- 右侧表单 -->
        <div class="register-form-area">
            <div class="form-header">
                <h3>社区团购管理系统 - 创建新账号</h3>
                <p>填写以下信息完成注册，加入平台</p>
                <div class="form-header-line"></div>
            </div>

            <div id="app">
                <el-form :model="registerForm" :rules="registerRules" ref="registerForm">
                    <div class="form-row">
                        <el-form-item prop="username">
                            <el-input
                                v-model="registerForm.username"
                                placeholder="用户名"
                                prefix-icon="el-icon-user"
                                size="medium">
                            </el-input>
                        </el-form-item>
                        <el-form-item prop="nickname">
                            <el-input
                                v-model="registerForm.nickname"
                                placeholder="真实姓名"
                                prefix-icon="el-icon-user-solid"
                                size="medium">
                            </el-input>
                        </el-form-item>
                    </div>

                    <div class="form-row">
                        <el-form-item prop="password">
                            <el-input
                                v-model="registerForm.password"
                                type="password"
                                placeholder="登录密码"
                                prefix-icon="el-icon-lock"
                                size="medium">
                            </el-input>
                        </el-form-item>
                        <el-form-item prop="confirmPassword">
                            <el-input
                                v-model="registerForm.confirmPassword"
                                type="password"
                                placeholder="确认密码"
                                prefix-icon="el-icon-lock"
                                size="medium">
                            </el-input>
                        </el-form-item>
                    </div>

                    <div class="form-row">
                        <el-form-item prop="email">
                            <el-input
                                v-model="registerForm.email"
                                placeholder="电子邮箱"
                                prefix-icon="el-icon-message"
                                size="medium">
                            </el-input>
                        </el-form-item>
                        <el-form-item prop="phone">
                            <el-input
                                v-model="registerForm.phone"
                                placeholder="手机号码"
                                prefix-icon="el-icon-phone"
                                size="medium">
                            </el-input>
                        </el-form-item>
                    </div>

                    <el-form-item prop="role">
                        <el-select
                            v-model="registerForm.role"
                            placeholder="请选择账号角色"
                            size="medium"
                            style="width:100%">
                            <el-option
                                v-for="role in roleOptions"
                                :key="role.value"
                                :label="role.label"
                                :value="role.value">
                                <span style="float:left">{{ role.label }}</span>
                                <span style="float:right;color:#8492a6;font-size:13px">{{ role.description }}</span>
                            </el-option>
                        </el-select>
                    </el-form-item>

                    <el-form-item prop="supplierCode">
                        <el-select
                            v-model="registerForm.supplierCode"
                            placeholder="请选择所属社区"
                            size="medium"
                            style="width:100%"
                            @change="onCommunityChange">
                            <el-option
                                v-for="item in communityOptions"
                                :key="item.supplierCode"
                                :label="item.supplierName"
                                :value="item.supplierCode">
                            </el-option>
                        </el-select>
                    </el-form-item>

                    <el-form-item>
                        <button
                            class="register-btn"
                            :disabled="loading"
                            @click.prevent="handleRegister">
                            {{ loading ? '注册中...' : '立 即 注 册' }}
                        </button>
                    </el-form-item>
                </el-form>

                <div class="form-footer">
                    已有账号？<a href="/login">返回登录</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    loading: false,
                    roleOptions: [],
                    communityOptions: [],
                    communityMap: {},
                    registerForm: {
                        username: '',
                        password: '',
                        confirmPassword: '',
                        nickname: '',
                        email: '',
                        phone: '',
                        role: 'user',
                        supplierCode: '',
                        supplierName: ''
                    },
                    registerRules: {
                        username: [
                            { required: true, message: '请输入用户名', trigger: 'blur' },
                            { min: 3, max: 20, message: '用户名长度在3到20个字符', trigger: 'blur' }
                        ],
                        password: [
                            { required: true, message: '请输入密码', trigger: 'blur' },
                            { min: 6, message: '密码长度不能少于6位', trigger: 'blur' }
                        ],
                        confirmPassword: [
                            { required: true, message: '请确认密码', trigger: 'blur' },
                            { validator: this.validateConfirmPassword, trigger: 'blur' }
                        ],
                        nickname: [
                            { required: true, message: '请输入真实姓名', trigger: 'blur' }
                        ],
                        email: [
                            { type: 'email', message: '请输入正确的邮箱地址', trigger: 'blur' }
                        ],
                        phone: [
                            { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的手机号', trigger: 'blur' }
                        ],
                        role: [
                            { required: true, message: '请选择角色', trigger: 'change' }
                        ],
                        supplierCode: [
                            { required: true, message: '请选择所属社区', trigger: 'change' }
                        ]
                    }
                }
            },
            created() {
                this.loadRoleOptions();
                this.loadCommunityOptions();
            },
            methods: {
                loadCommunityOptions() {
                    axios.get('/api/auth/community-options').then(response => {
                        if (response.data.code === 200) {
                            this.communityOptions = response.data.data || [];
                            this.communityMap = {};
                            this.communityOptions.forEach(item => {
                                this.communityMap[item.supplierCode] = item.supplierName;
                            });
                        }
                    }).catch(error => {
                        console.error('加载社区列表失败:', error);
                    });
                },
                onCommunityChange(code) {
                    this.registerForm.supplierName = this.communityMap[code] || '';
                },
                loadRoleOptions() {
                    this.roleOptions = LayoutConfig.utils.getRegisterRoles();
                    if (this.roleOptions.length > 0) {
                        this.registerForm.role = this.roleOptions[0].value;
                    }
                },
                validateConfirmPassword(rule, value, callback) {
                    if (value !== this.registerForm.password) {
                        callback(new Error('两次输入密码不一致'));
                    } else {
                        callback();
                    }
                },
                handleRegister() {
                    this.$refs.registerForm.validate((valid) => {
                        if (valid) {
                            this.loading = true;
                            const { confirmPassword, ...formData } = this.registerForm;
                            axios.post('/api/auth/register', formData)
                                .then(response => {
                                    if (response.data.code === 200) {
                                        this.$message.success(response.data.message);
                                        setTimeout(() => {
                                            window.location.href = '/login';
                                        }, 1500);
                                    } else {
                                        this.$message.error(response.data.message);
                                    }
                                })
                                .catch(error => {
                                    console.error('注册失败:', error);
                                    this.$message.error('注册失败，请稍后重试');
                                })
                                .finally(() => {
                                    this.loading = false;
                                });
                        }
                    });
                }
            }
        });
    </script>
</body>
</html>
